const KB=[
 {id:'chemo',title:'化疗常见副作用及居家应对',tags:['化疗','副作用','恶心','呕吐','脱发','乏力','骨髓抑制'],
  body:`<h4>一、为什么化疗会有副作用</h4><p>化疗药物在杀伤快速分裂的肿瘤细胞的同时，也会影响体内同样快速分裂的正常细胞（如毛囊、胃肠道黏膜、骨髓造血细胞），因此出现一系列反应。多数副作用是<b>可逆的</b>，治疗结束后会逐渐恢复。</p>
  <h4>二、常见副作用与应对</h4>
  <ul>
    <li><b>恶心呕吐：</b>可在医生指导下使用止吐药（如昂丹司琼、阿瑞匹坦）；少量多餐、清淡软食，避免油腻气味；饭后坐位或半卧 1 小时。</li>
    <li><b>食欲下降/味觉改变：</b>增加餐次、用酸味或香料提味；优先保证蛋白质摄入（蛋、奶、鱼、豆制品）。</li>
    <li><b>脱发：</b>多为暂时性，可提前准备帽子/假发；头皮温和护理，避免烫染。</li>
    <li><b>乏力：</b>保证休息与睡眠，量力进行轻活动（散步），避免完全卧床导致体能下降。</li>
    <li><b>骨髓抑制（白细胞/血小板降低）：</b>见"白细胞低怎么办"专题；定期复查血常规。</li>
    <li><b>口腔溃疡、腹泻、便秘：</b>保持口腔清洁、软食；腹泻注意补液，便秘增加纤维与饮水，严重时就医。</li>
  </ul>
  <h4>三、什么时候必须就医</h4><p>出现<b>持续高热（≥38.3℃）</b>、寒战、呼吸困难、严重腹泻（一天多次水样便）、出血不止、明显头晕乏力，请<b>立即联系医生或急诊</b>，不要自行观察等待。</p>`},
 {id:'wbc',title:'化疗后白细胞/中性粒细胞低（粒缺）怎么办',tags:['白细胞','中性粒','粒缺','升白','感染','化疗'],
  body:`<h4>一、先看懂化验单</h4><p>化疗常抑制骨髓造血，最常见的是<b>白细胞（WBC）</b>尤其是<b>中性粒细胞绝对计数（ANC）</b>下降。医生通常用 ANC 判断"粒细胞缺乏（粒缺）"风险：ANC＜1.5×10⁹/L 为减少，＜0.5×10⁹/L 为粒缺，此时感染风险显著升高。</p>
  <h4>二、居家防护要点</h4>
  <ul>
    <li><b>防感染：</b>勤洗手（七步洗手法），戴口罩少去人群密集、通风差的场所；家中每日通风；避免生食（贝类、生鱼片、未熟蛋肉）和隔夜凉菜。</li>
    <li><b>监测体温：</b>每日早晚测体温，出现异常及时记录；体温≥38℃ 或感觉发冷寒战，立即就医。</li>
    <li><b>口腔与皮肤：</b>软毛牙刷、生理盐水漱口；避免磕碰，小心处理伤口。</li>
    <li><b>饮食：</b>高蛋白、高热量、易消化，充分加热；注意食品安全。</li>
  </ul>
  <h4>三、关于"升白"</h4><p>是否使用<b>重组人粒细胞集落刺激因子（G-CSF，俗称升白针）</b>由医生根据血细胞计数与方案决定，切勿自行用药或预防性滥用。食疗（如高蛋白饮食）不能替代药物升白。</p>
  <h4>四、复查血常规的频率</h4><p>一般化疗后 <b>7–14 天</b>是血象最低谷（"骨髓抑制期"），多数方案要求此期间复查血常规 1–2 次，具体遵医嘱。</p>`},
 {id:'target',title:'靶向治疗注意事项与不良反应管理',tags:['靶向药','靶向治疗','皮疹','腹泻','不良反应','副作用'],
  body:`<h4>一、靶向治疗是什么</h4><p>靶向药物针对肿瘤细胞特定的分子靶点发挥作用，相对化疗"更有针对性"，但仍有特征性不良反应，且<b>多数需要长期规律服用</b>。</p>
  <h4>二、最常见不良反应</h4>
  <ul>
    <li><b>皮肤反应（痤疮样皮疹、皮肤干燥、甲沟炎）：</b>保持皮肤保湿、防晒；轻中度可外用药物，中重度需医生评估是否调整剂量。</li>
    <li><b>腹泻：</b>记录次数与性状，轻者补液调饮食，重者用止泻药并就医；警惕脱水。</li>
    <li><b>高血压：</b>部分抗血管生成类药物可致血压升高，需规律监测血压并按医嘱用药。</li>
    <li><b>肝功能异常：</b>定期复查肝功能，异常时由医生判断继续、减量或暂停。</li>
  </ul>
  <h4>三、服药关键原则</h4><p><b>务必按时按量服用，不可随意停药、减量或漏服；</b>漏服处理严格遵循药品说明书与医生指示。避免自行合用可能影响药效的中西药/保健品，服药前主动告知医生全部在用药物。出现严重不良反应（如严重腹泻、呼吸困难、大量皮疹、胸痛）立即就医。</p>`},
 {id:'radio',title:'放疗期间皮肤护理与饮食',tags:['放疗','皮肤','放射性皮炎','饮食'],
  body:`<h4>一、放疗区皮肤护理</h4>
  <ul>
    <li>照射区域皮肤保持清洁干燥，用温水轻柔清洗，<b>禁用肥皂、酒精、碘酒、香水</b>等刺激物。</li>
    <li>穿宽松柔软棉质衣物，避免摩擦、暴晒、抓挠；划线标记勿擦洗掉。</li>
    <li>出现红斑、脱皮、瘙痒可遵医嘱用护肤剂；若出现破溃、渗液及时告诉放疗科。</li>
  </ul>
  <h4>二、饮食建议</h4><p>放疗反应因部位而异：头颈部放疗易口腔溃疡、吞咽痛，宜软食、流质、低温；胸腹盆腔放疗可能恶心、腹泻，宜低脂清淡。总体仍强调<b>高蛋白、充足热量、多饮水</b>，少量多餐。</p>
  <h4>三、其他</h4><p>保持口腔清洁（头颈放疗尤为重要）；注意休息、戒烟酒；按预约完成每次照射，勿擅自中断。</p>`},
 {id:'immuno',title:'免疫治疗（PD-1/PD-L1）不良反应识别',tags:['免疫','免疫治疗','irAE','PD-1','不良反应'],
  body:`<h4>一、什么是 irAE</h4><p>免疫检查点抑制剂（如 PD-1/PD-L1 抑制剂）通过激活自身免疫攻击肿瘤，但也可能攻击正常组织，产生<b>免疫相关不良反应（irAE）</b>，可累及皮肤、肠道、肝脏、内分泌、肺等多个器官，<b>多数可管理，但需早识别</b>。</p>
  <h4>二、需警惕的信号</h4>
  <ul>
    <li><b>皮肤：</b>皮疹、瘙痒加重。</li>
    <li><b>肠道：</b>新发或持续腹泻、便血、腹痛——警惕免疫性肠炎。</li>
    <li><b>肝脏：</b>乏力、黄疸、转氨酶升高（化验发现）。</li>
    <li><b>内分泌：</b>持续乏力、食欲改变、怕冷、心慌——可能累及甲状腺/垂体/肾上腺。</li>
    <li><b>肺部：</b>新发咳嗽、气短、胸痛——警惕免疫性肺炎（可严重）。</li>
  </ul>
  <h4>三、原则</h4><p>出现上述任何持续或加重的不适，<b>及时告知主治医生</b>，不要自行用激素或止泻药掩盖症状。定期抽血查肝肾功能、甲状腺功能。早发现的 irAE 大多经暂停用药+规范处理可缓解。</p>`},
 {id:'marker',title:'肿瘤标志物怎么解读（CEA/CA153/CA125/AFP/PSA）',tags:['肿瘤标志物','CEA','CA153','CA125','AFP','PSA','指标'],
  body:`<h4>一、基本认识</h4><p>肿瘤标志物是血液中的一些物质（多为蛋白质），某些肿瘤会使其升高。但<b>升高不等于复发/转移</b>——炎症、吸烟、肝肾疾病、月经期等都可能影响；<b>正常范围也不代表一定没事</b>。它的价值主要在"<b>动态观察趋势</b>"和结合影像综合判断。</p>
  <h4>二、常见标志物参考</h4>
  <table><tr><th>标志物</th><th>常见于</th><th>提示</th></tr>
  <tr><td>CEA（癌胚抗原）</td><td>结直肠、胃、肺、乳腺等腺癌</td><td>广谱，升高需结合部位</td></tr>
  <tr><td>CA153</td><td>乳腺癌</td><td>疗效与随访参考</td></tr>
  <tr><td>CA125</td><td>卵巢上皮癌</td><td>疗效与复发监测</td></tr>
  <tr><td>AFP（甲胎蛋白）</td><td>肝细胞癌、生殖细胞肿瘤</td><td>特异性较强</td></tr>
  <tr><td>PSA（前列腺特异抗原）</td><td>前列腺癌</td><td>筛查与随访</td></tr></table>
  <h4>三、怎么看自己的数据</h4><p>在本工具的"指标跟踪"里逐次录入数值，看<b>曲线走向</b>比单次数值更有意义。若数值持续、明显上升，或术后已正常又反弹，请带着完整记录复诊，由医生结合影像判断，<b>切勿自行对号入座、过度焦虑</b>。</p>`},
 {id:'cbc',title:'血常规报告怎么看（白细胞/中性粒/血红蛋白/血小板）',tags:['血常规','白细胞','血红蛋白','血小板','中性粒','化验单'],
  body:`<h4>一、四项核心指标</h4>
  <table><tr><th>项目</th><th>主要意义</th><th>低了/高了提示</th></tr>
  <tr><td>白细胞 WBC</td><td>抗感染能力</td><td>低：易感染；高：感染/炎症/药物</td></tr>
  <tr><td>中性粒细胞 ANC</td><td>抗细菌主力</td><td>低：粒缺风险（见专题）</td></tr>
  <tr><td>血红蛋白 Hb</td><td>携氧能力</td><td>低：贫血（乏力、头晕）</td></tr>
  <tr><td>血小板 PLT</td><td>止血凝血</td><td>低：出血风险；高：血栓风险</td></tr></table>
  <h4>二、怎么记录</h4><p>把每次化验的上述数值录入本工具"指标跟踪"，可建"白细胞""血红蛋白""血小板"等自定义指标，就能看到恢复曲线，复诊时直接给医生看。</p>
  <h4>三、贫血居家注意</h4><p>适当补充富含铁与蛋白的食物（红肉、动物血、深绿蔬菜），乏力明显时减少剧烈活动、防跌倒；严重贫血需医生评估是否输血或用药。</p>`},
 {id:'pain',title:'癌性疼痛评估与三阶梯止痛',tags:['疼痛','止痛','三阶梯','吗啡','疼痛管理'],
  body:`<h4>一、先学会打分</h4><p>疼痛可用 <b>0–10 数字评分</b>：0 无痛，1–3 轻度，4–6 中度，7–10 重度；也可描述"不影响睡眠/影响睡眠/无法入睡"。本工具"疼痛管理"模块可每天记录评分与部位。</p>
  <h4>二、WHO 三阶梯止痛原则</h4>
  <ul>
    <li>轻度疼痛：非甾体抗炎药（如布洛芬）等。</li>
    <li>中度疼痛：弱阿片类（如曲马多）± 非甾体。</li>
    <li>重度疼痛：强阿片类（如吗啡、羟考酮）± 辅助用药。</li>
  </ul>
  <p>原则还包括：<b>口服首选、按时给药（不是疼了才吃）、个体化、注意细节</b>。不要因害怕"上瘾"而忍痛——规范使用下成瘾罕见，控制疼痛本身有利于恢复与生活质量。</p>
  <h4>三、务必告知医生</h4><p>疼痛性质改变、突然加重、出现新部位疼痛或伴随神经症状，及时复诊，排除骨转移、脊髓压迫等急症。</p>`},
 {id:'nutrition',title:'治疗期间营养支持原则',tags:['营养','饮食','蛋白','恶病质','体重','食疗'],
  body:`<h4>一、为什么营养重要</h4><p>肿瘤及治疗的消耗、食欲减退常导致体重下降与<b>肌肉流失（恶病质）</b>，直接影响耐受治疗与预后。营养的目标是<b>维持体重与体能</b>。</p>
  <h4>二、核心原则</h4>
  <ul>
    <li><b>高蛋白：</b>每餐保证优质蛋白（鱼、禽、蛋、奶、豆制品），必要时加用医学营养补充剂（ONS）。</li>
    <li><b>充足热量：</b>少量多餐（5–6 餐），优先吃能量密度高的食物。</li>
    <li><b>清淡易消化：</b>烹饪以蒸煮炖为主，避免油腻辛辣；有口腔溃疡时改流质半流质。</li>
    <li><b>充分水分：</b>无禁忌时每日 1500–2000ml（具体遵医嘱，心肾功不全者限水）。</li>
  </ul>
  <h4>三、常见误区</h4><p>"只吃素、饿死肿瘤"不可取——饥饿先影响的是正常细胞；"大补特补"增加肠胃负担。体重持续下降、进食量明显减少时，<b>主动咨询临床营养科</b>，必要时肠内/肠外营养支持。</p>`},
 {id:'food',title:'饮食安全与常见忌口误区',tags:['饮食','忌口','生食','食品安全','发物'],
  body:`<h4>一、食品安全第一（尤其血象低时）</h4>
  <ul>
    <li>不吃生食（生鱼片、半熟蛋、未灭菌乳）、不吃隔夜凉菜；肉类蛋类彻底煮熟。</li>
    <li>蔬果洗净或去皮；餐具消毒；饭前便后洗手。</li>
    <li>在外就餐选择卫生可靠的场所。</li>
  </ul>
  <h4>二、关于"忌口/发物"</h4><p>多数所谓"发物"（如鸡、鱼、蛋、海鲜）并非绝对禁忌，只要不过敏、烹饪得当都可适量食用，反而有助于补蛋白。<b>真正要限制的是：酒精、高糖高脂油炸、腌制熏制食品。</b>个别治疗（如靶向药）可能有特定饮食注意（如西柚/柚子类影响部分药物代谢），请遵医嘱。</p>
  <h4>三、调味与口感</h4><p>治疗期味觉改变常见，可用柠檬、醋、葱蒜、香菇等提味；少食多餐减轻饱胀。</p>`},
 {id:'followup',title:'复查随访计划怎么安排',tags:['复查','随访','复查计划','复发','随访间隔'],
  body:`<h4>一、随访的目的</h4><p>随访用于<b>监测复发转移、评估远期副作用、管理合并症</b>。即使已"临床治愈"，也需按方案长期随访。</p>
  <h4>二、一般节奏（以医生方案为准）</h4>
  <ul>
    <li>治疗后 <b>2 年内</b>：通常每 3–6 个月一次。</li>
    <li><b>2–5 年</b>：每 6–12 个月一次。</li>
    <li><b>5 年后</b>：可每年一次（部分癌种更长）。</li>
  </ul>
  <h4>三、随访通常包括</h4><p>病史查体、肿瘤标志物、影像学（CT/超声/MRI 等）、必要时内镜。把历次结果录入本工具，纵向对比最有价值。</p>
  <h4>四、警惕复发信号</h4><p>新发持续疼痛、不明原因体重下降、咯血/便血、淋巴结肿大、原部位新包块等，<b>不必等预约日期，尽快就医</b>。</p>`},
 {id:'rehab',title:'术后康复与功能锻炼',tags:['术后','康复','功能锻炼','运动','淋巴水肿'],
  body:`<h4>一、早活动、循序渐进</h4><p>术后在医生允许下尽早下床活动，预防血栓与肺部感染；功能锻炼从被动→主动→抗阻逐步推进，<b>以不引起疼痛、不过度疲劳为度</b>。</p>
  <h4>二、不同部位要点</h4>
  <ul>
    <li><b>乳腺癌术后：</b>循序渐进做患侧上肢爬墙、梳头、肩部活动，预防肩关节挛缩；注意淋巴水肿预防（避免患侧测血压、抽血、提重物、蚊虫叮咬）。</li>
    <li><b>腹部/盆腔术后：</b>逐步恢复核心与盆底训练，避免过早负重。</li>
    <li><b>下肢/骨科相关：</b>遵医嘱负重进度，防跌倒。</li>
  </ul>
  <h4>三、记录与反馈</h4><p>用本工具"运动康复"记录每天活动类型与时长，出现伤口渗液、异常肿痛、活动时剧痛要及时复诊。</p>`},
 {id:'psych',title:'心理调适与睡眠障碍应对',tags:['心理','情绪','失眠','焦虑','抑郁','心情'],
  body:`<h4>一、情绪起伏很正常</h4><p>确诊与治疗带来焦虑、恐惧、低落非常普遍，不代表"意志薄弱"。接纳情绪、主动表达，是恢复的重要部分。</p>
  <h4>二、日常调节</h4>
  <ul>
    <li>规律作息、适度运动（散步、八段锦、瑜伽）、晒太阳。</li>
    <li>与信任的家人朋友倾诉，或加入病友互助社群（注意甄别信息）。</li>
    <li>练习深呼吸、正念、听舒缓音乐。</li>
    <li>用本工具"心情日记"记录情绪变化，复诊时便于沟通。</li>
  </ul>
  <h4>三、何时寻求专业帮助</h4><p>若持续两周以上情绪低落、兴趣丧失、失眠或早醒、食欲明显改变、出现消极念头，请告知医生并寻求<b>心理科/精神科</b>专业支持，必要时药物干预，这同样是治疗的一部分。</p>`},
 {id:'insurance',title:'医保报销与大病救助政策概览',tags:['医保','报销','大病','救助','费用','政策'],
  body:`<h4>一、基本医保</h4><p>住院与门诊慢特病（多地已将恶性肿瘤纳入"门诊特殊病种/慢病"）可按政策报销，<b>先确认当地是否办理"门特/门慢"备案</b>，可大幅提高门诊放化疗报销比例。</p>
  <h4>二、大病保险与救助</h4>
  <ul>
    <li><b>大病保险：</b>基本医保报销后个人负担超过起付线的部分，可再按比例报销。</li>
    <li><b>医疗救助：</b>低保、特困等困难群体可申请，具体咨询户籍地医保/民政部门。</li>
    <li><b>惠民保/商业保险：</b>各地"惠民保"通常带病可保，可补充报销；已有商业险按合同理赔。</li>
  </ul>
  <h4>三、实用建议</h4><p>保留所有发票、费用清单、诊断证明；用本工具"费用记录"分类记账，报销时一目了然；涉及异地就医先办<b>异地备案</b>。政策因地而异，以当地医保部门最新规定为准。</p>`},
 {id:'thrombosis',title:'肿瘤患者血栓预防',tags:['血栓','抗凝','高凝','下肢静脉','预防'],
  body:`<h4>一、为什么风险高</h4><p>恶性肿瘤本身及手术、化疗、长期卧床等，使血液处于"高凝状态"，<b>静脉血栓栓塞（VTE，含下肢深静脉血栓与肺栓塞）风险升高</b>，肺栓塞可危及生命。</p>
  <h4>二、识别信号</h4>
  <ul>
    <li>单侧腿肿、痛、皮温升高、发红——警惕下肢深静脉血栓。</li>
    <li>突发呼吸困难、胸痛、咯血、心跳加快——警惕肺栓塞（急症，立即就医）。</li>
  </ul>
  <h4>三、预防</h4><p>在医生评估下尽早活动、床上做踝泵运动；避免长时间不动；高风险者可能需药物预防（抗凝）。勿自行服用阿司匹林等抗凝药。长途坐车/飞机多活动下肢、补水。</p>`},
 {id:'nausea',title:'治疗相关恶心呕吐的详细应对',tags:['恶心呕吐','止吐','昂丹司琼','阿瑞匹坦','延迟性呕吐','化疗','放疗','食欲','反胃'],
  body:`<h4>一、为什么会吐</h4><p>化疗药、部分靶向药、放疗（尤其腹部/全脑）会刺激呕吐中枢或胃肠道，引发恶心呕吐。医生按"致吐风险"把方案分为高/中/低/极低致吐，并据此预防性用止吐药——<b>预防远比吐了再治有效</b>。</p>
  <h4>二、三种类型</h4>
  <ul><li><b>急性：</b>用药后数分钟至数小时内发生。</li>
  <li><b>延迟性：</b>用药后 24 小时后甚至第 2–5 天出现，常见于顺铂、卡铂、环磷酰胺等，最易被忽视，却最影响进食。</li>
  <li><b>预期性：</b>既往呕吐严重者，下次治疗前因条件反射就恶心——需心理放松、提前用药。</li></ul>
  <h4>三、居家应对</h4>
  <ul><li>遵医嘱<b>按时</b>服止吐药（如昂丹司琼、格拉司琼、帕洛诺司琼；高致吐常联合阿瑞匹坦/地塞米松），不要等吐了才吃。</li>
  <li>少量多餐、清淡软食，避开油腻、甜腻、气味重的食物；姜片、薄荷、柠檬可缓解。</li>
  <li>进食后坐位或半卧 1 小时，避免平躺；小口啜饮防脱水。</li>
  <li>环境通风无异味；听音乐、深呼吸放松；记录每次呕吐次数与能否进水。</li></ul>
  <h4>四、何时就医</h4><p>呕吐频繁无法进水、尿少口干（脱水）、体重明显下降、呕血或咖啡色物、腹痛剧烈，立即联系医生，可能需静脉补液与调整止吐方案。</p>`},
 {id:'appetite',title:'食欲下降、体重减轻与恶病质管理',tags:['食欲','体重','恶病质','消瘦','营养','肌肉流失','吃不下','肿瘤消耗'],
  body:`<h4>一、为什么越来越瘦</h4><p>肿瘤本身会释放炎症因子导致"不想吃+代谢紊乱"，加上治疗副作用，容易出现体重与肌肉持续流失（恶病质）。<b>体重下降超过原体重 5% 就值得警惕</b>，不是"减肥成功"。</p>
  <h4>二、怎么吃才对</h4>
  <ul><li><b>高蛋白优先：</b>每餐都有鱼、禽、蛋、奶、豆制品；红肉、动物血补铁。</li>
  <li><b>小份多餐：</b>每天 5–6 餐，挑胃口最好的时段多吃；优先吃能量密度高的食物（如蒸蛋羹、奶昔、坚果酱）。</li>
  <li>味觉改变时用柠檬、醋、葱蒜、香菇提味；口腔溃疡改流质半流质。</li>
  <li>口服营养补充剂（ONS，如全营养配方粉）在吃不够时很有用，可在营养科指导下使用。</li></ul>
  <h4>三、运动抗消耗</h4><p>"躺着养"反而加速肌肉流失。在体力允许下做轻活动（散步、握力、抬腿），有助于保住肌肉、改善食欲。</p>
  <h4>四、何时求助营养科</h4><p>一周内体重下降明显、进食量不及平时一半、持续吃不下超过 3 天，主动挂临床营养科，必要时肠内/肠外营养支持。</p>`},
 {id:'fatigue',title:'癌性疲劳（CRF）的识别与缓解',tags:['疲劳','乏力','癌性疲劳','累','没劲','精力','休息'],
  body:`<h4>一、这不是普通的累</h4><p>癌性疲劳（CRF）是肿瘤及治疗常见的全身性衰竭，<b>休息后也难以缓解</b>，与贫血、失眠、疼痛、情绪低落、药物毒性都有关。它不是"意志薄弱"，是疾病本身的表现。</p>
  <h4>二、缓解方法（证据支持）</h4>
  <ul><li><b>规律运动：</b>听起来反直觉，但散步、太极、八段锦等轻运动被证实能减轻疲劳，比长时间卧床更好。</li>
  <li><b>保存精力（节能）：</b>把重要的事安排在精力好的时段；坐代替站、借助扶手、请家人分担。</li>
  <li>保证睡眠、治疗贫血与疼痛、管理情绪。</li>
  <li>记录疲劳程度（本工具"体能状态"模块可记 ECOG 评分），复诊时告诉医生。</li></ul>
  <h4>三、何时就医</h4><p>突发极度乏力伴胸痛、气短、头晕站不稳，或乏力进行性加重影响日常，及时复诊排查贫血、心肾功能、甲减等可纠正原因。</p>`},
 {id:'mucositis',title:'口腔黏膜炎与口腔溃疡护理',tags:['口腔溃疡','口腔黏膜炎','嘴痛','咽炎','吞嚥痛','口腔','护理'],
  body:`<h4>一、谁容易得</h4><p>化疗（尤其氟尿嘧啶类、甲氨蝶呤）、头颈部放疗最易引发口腔黏膜炎，表现为红肿、溃疡、剧痛，影响吃饭说话，严重时可感染。</p>
  <h4>二、分级与护理</h4>
  <ul><li><b>轻（红/微痛）：</b>软毛牙刷、饭后生理盐水或碳酸氢钠漱口；避免辛辣烫硬食物。</li>
  <li><b>中（溃疡、进食痛）：</b>餐前可用医生开的含漱止痛液（如利多卡因含漱）；改软食、低温食物（酸奶、果冻）。</li>
  <li><b>重（不能进食）：</b>需营养支持，警惕真菌感染（鹅口疮），由医生处理。</li></ul>
  <h4>三、止痛与营养</h4><p>疼痛明显时不要用酒精漱口水（更痛）。保证蛋白与热量，必要时 ONS 或管饲。用本工具记录溃疡程度。</p>
  <h4>四、何时就医</h4><p>溃疡面扩大、化脓、伴高热、张口困难或完全无法进水，立即联系医生。</p>`},
 {id:'diarrhea',title:'腹泻的鉴别与居家处理',tags:['腹泻','拉肚子','水样便','肠炎','补水','消化','靶向药','免疫性肠炎'],
  body:`<h4>一、先分清原因</h4><p>腹泻可由化疗/靶向药、放疗（腹盆腔）、肠梗阻、感染、或免疫治疗引起的<b>免疫性肠炎</b>导致。原因不同，处理天差地别，<b>别一味吃止泻药</b>。</p>
  <h4>二、居家处理</h4>
  <ul><li>记录次数、量、性状（水样/带血/黏液）、有无腹痛发热。</li>
  <li><b>补液第一位：</b>口服补液盐（ORS）或淡盐水+糖，防脱水；少量多次。</li>
  <li>饮食改低脂低渣：米汤、白粥、面条、馒头、香蕉、苹果泥（BRAT 思路）；避免乳制品、高纤、油腻。</li>
  <li>轻症可用蒙脱石散等；靶向药相关腹泻医生可能开洛哌丁胺。</li></ul>
  <h4>三、危险信号——立即就医</h4><p>一天多次水样便、带血或黑便、高热、严重腹痛、头晕尿少（脱水）、免疫治疗期间新发腹泻，<b>尽快急诊</b>，免疫性肠炎需及时用激素。</p>`},
 {id:'constipation',title:'便秘的预防与处理（尤其阿片类用药）',tags:['便秘','排便','阿片','止痛药','腹胀','通便','大便'],
  body:`<h4>一、为什么容易便秘</h4><p>阿片类止痛药（吗啡、羟考酮、芬太尼）会显著抑制肠蠕动；活动少、喝水少、纤维不足、焦虑也会加重。<b>用阿片类药物者几乎都会便秘，需主动预防而非等发生了再治</b>。</p>
  <h4>二、预防</h4>
  <ul><li>多喝水（无禁忌时 1500–2000ml/天）、增加膳食纤维（蔬果、燕麦、杂粮）。</li>
  <li>在医生/药师指导下<b>预防性</b>用缓泻药（如乳果糖、聚乙二醇），阿片所致便秘有时需特定药物（如甲基纳曲酮）。</li>
  <li>适度活动、定时如厕、不憋便。</li></ul>
  <h4>三、处理与警惕</h4><p>已便秘可临时用开塞露/缓泻剂；若 3 天以上未排便伴腹胀呕吐、肛门停止排气，警惕<b>肠梗阻</b>，立即就医，不要强行通便。</p>`},
 {id:'anemia',title:'贫血（血红蛋白低）的原因与应对',tags:['贫血','血红蛋白','Hb','乏力','头晕','输血','促红素','补铁'],
  body:`<h4>一、看见数值先判断</h4><p>成年男性 Hb＜120、女性＜110 g/L 通常判为贫血（不同实验室标准略异）。肿瘤患者贫血常见原因：化疗骨髓抑制、出血、营养不良（缺铁/叶酸/B12）、慢性病、肾功影响促红素。</p>
  <h4>二、居家注意</h4>
  <ul><li>适当补充富含铁与蛋白的食物（红肉、动物血、深绿蔬菜、蛋奶）；维 C 助铁吸收，茶/咖啡影响吸收（错开）。</li>
  <li>乏力明显时减少剧烈活动、防跌倒；起身慢防体位性低血压。</li>
  <li>用本工具"指标跟踪"录入 Hb，看恢复曲线。</li></ul>
  <h4>三、治疗</h4><p>明确缺铁可补铁（口服或静脉）；重度贫血或症状明显者，医生可能输血或用地舒单抗/促红素等，<b>不要自行买"补血药"</b>。持续加重或伴出血、胸痛、气短，及时复诊。</p>`},
 {id:'platelet',title:'血小板减少与出血预防',tags:['血小板','PLT','出血','瘀斑','牙龈出血','鼻血','输注血小板','凝血'],
  body:`<h4>一、分级看风险</h4><p>血小板（PLT）正常约 100–300×10⁹/L。＜100 为减少；＜50 出血风险升高；＜20–30 自发性出血风险大；＜10 需紧急关注。出血风险随数值降低陡增。</p>
  <h4>二、居家防护（防出血）</h4>
  <ul><li>软毛牙刷、动作轻柔；用牙线/牙签要小心；鼻腔干燥可涂凡士林。</li>
  <li>避免磕碰、剧烈运动、用力擤鼻；剃须用电动；通便防肛裂（见便秘篇）。</li>
  <li>观察皮肤瘀点瘀斑、牙龈/鼻出血、尿色发红、黑便、月经量突增。</li>
  <li>少吃坚硬尖锐食物，防口腔黏膜划伤。</li></ul>
  <h4>三、何时急诊</h4><p>出现<b>头痛呕吐（警惕颅内出血）、大量鼻血止不住、呕血黑便、血尿、月经不止</b>，立即急诊，可能需要输血小板。是否升血小板由医生按计数与出血决定。</p>`},
 {id:'fever',title:'发热与粒缺发热（必须立刻处理）',tags:['发热','发烧','粒缺','高烧','感染','急诊','体温','寒战'],
  body:`<h4>一、这是急症，不是普通感冒</h4><p>化疗后白细胞/中性粒低时，身体"抗感染防线"薄弱，一点点感染都可能迅速恶化。<b>体温 ≥38.3℃（或 ≥38℃ 持续）且 ANC 低，称为"粒缺发热"，属肿瘤急症</b>。</p>
  <h4>二、在家怎么做</h4>
  <ul><li>每日早晚测体温并记录（本工具可记）。发现发热<b>立即</b>联系主治医生/急诊，不要先自行观察或乱用退烧药掩盖。</li>
  <li>就诊时主动说明"正在化疗、血象低"，这会改变医生处置优先级。</li>
  <li>去急诊戴口罩、保暖、带好病历与近期化验。</li>
  <li>多喝水、物理降温（温水擦浴），避免捂汗。</li></ul>
  <h4>三、预警</h4><p>伴寒战、意识模糊、呼吸困难、血压下降为休克征兆，<b>呼叫 120</b>。记住：粒缺期发热，时间就是生命，宁可"虚惊一场"也要尽快就医。</p>`},
 {id:'neuropathy',title:'周围神经病变（手脚麻木刺痛）',tags:['周围神经病变','手脚麻','麻木','刺痛','神经毒性','铂类','紫杉','感觉异常'],
  body:`<h4>一、哪些治疗会引起</h4><p>铂类（奥沙利铂、顺铂）、紫杉类（紫杉醇、多西他赛）、长春碱类、硼替佐米等常损伤周围神经，表现为手脚麻木、刺痛、发冷、感觉减退，重者影响持物行走。</p>
  <h4>二、居家防护</h4>
  <ul><li><b>防烫伤/外伤：</b>手脚感觉迟钝，洗澡先试水温、用防烫杯、避免赤脚；厨房戴手套。</li>
  <li><b>防跌倒：</b>穿防滑鞋、起身慢、夜间开灯；平衡差时用助行器。</li>
  <li>保暖（奥沙利铂遇冷加重麻木，冬日避免冷风冷物刺激）。</li>
  <li>记录麻木范围与程度（本工具疼痛/症状模块），复诊反馈。</li></ul>
  <h4>三、可逆性</h4><p>多数在停药后逐渐恢复，少数遗留。医生可能调整剂量或用营养神经药物（B 族、α-硫辛酸等，证据不一）。出现行走困难、肌肉萎缩、新发疼痛加重，及时复诊。</p>`},
 {id:'hfs',title:'手足皮肤反应（手足综合征）',tags:['手足综合征','HFS','手脚红肿','脱皮','掌跖','靶向药','多激酶抑制剂'],
  body:`<h4>一、是什么</h4><p>多见于多靶点酪氨酸激酶抑制剂（如索拉非尼、瑞戈非尼、卡培他滨等），表现为手掌足底红肿、麻木、刺痛、脱屑、甚至水疱破溃，影响抓握行走。</p>
  <h4>二、分级与处理</h4>
  <ul><li><b>1 级：</b>轻微红肿麻木，继续用药+加强护理。</li>
  <li><b>2 级：</b>疼痛影响活动，医生可能减停或用药（尿素霜、糖皮质激素软膏）。</li>
  <li><b>3 级：</b>严重影响生活，需暂停靶向药至恢复。</li></ul>
  <h4>三、日常护理</h4><p>温水洗手足、厚涂保湿霜（含尿素）；避免摩擦受压（软底鞋、减压垫、少提重物）；防晒防冻；不撕皮。破溃感染及时就诊。</p>`},
 {id:'htn',title:'靶向药相关高血压的监测与管理',tags:['高血压','血压','靶向药','抗血管生成','降压药','血管','危象'],
  body:`<h4>一、为什么会升高</h4><p>抗血管生成类靶向药（贝伐珠单抗、索拉非尼、舒尼替尼等）常致血压升高，多在用药早期出现，需规律监测。</p>
  <h4>二、监测与处理</h4>
  <ul><li>家中备血压计，<b>每日固定时间测</b>并记录（本工具可建"收缩压/舒张压"指标）。</li>
  <li>轻度升高先生活方式（低盐、规律作息、避剧烈波动）；中重度由医生开降压药（常选 ACEI/ARB 类）。</li>
  <li>多数可控，不必因此轻易停靶向药——由医生权衡。</li></ul>
  <h4>三、危象信号</h4><p>血压骤升伴头痛、视物模糊、胸痛、气短，为高血压急症，<b>立即就医</b>。切勿自行加量降压药。</p>`},
 {id:'dyspnea',title:'呼吸困难、咳嗽与胸腹水',tags:['呼吸困难','气短','咳嗽','胸水','腹水','胸腔积液','肺','喘'],
  body:`<h4>一、可能的原因</h4><p>气短/咳嗽可由肿瘤压迫气道、胸腔积液、肺部感染、肺栓塞、心衰、免疫治疗肺炎、贫血等引起，原因不同处置迥异。</p>
  <h4>二、居家观察</h4>
  <ul><li>记录诱因（活动/平卧加重？）、伴随（咯血、发热、胸痛、腿肿）、夜间能否平卧。</li>
  <li>半卧位休息、吸氧（若医生已配）、慢深呼吸；避免油烟与粉尘。</li>
  <li>胸腔积液/腹水导致胀闷，医生可穿刺引流缓解。</li></ul>
  <h4>三、何时急诊</h4><p>突发严重气短、嘴唇发紫、咯血、伴胸痛或心跳极快，<b>立即急诊</b>（警惕肺栓塞、气胸、大量胸水）。</p>`},
 {id:'lymph',title:'淋巴水肿的预防与护理',tags:['淋巴水肿','胳膊肿','乳腺癌','淋巴结清扫','压力','水肿','康复'],
  body:`<h4>一、谁要注意</h4><p>乳腺癌腋窝淋巴结清扫/放疗、盆腔/腹股沟淋巴结清扫者，患肢/下肢淋巴回流受阻，可能出现进行性肿胀（淋巴水肿），早期可逆，晚期难愈。</p>
  <h4>二、预防是关键</h4>
  <ul><li><b>患侧"三不"：</b>不测血压、不抽血打针、不提重物。</li>
  <li>避免蚊虫叮咬、刀伤、烫伤、美甲美甲；保持皮肤清洁防感染（感染会骤然加重）。</li>
  <li>避免过紧衣物/首饰压迫；坐飞机可弹力袖套。</li>
  <li>做医生指导的患肢功能与引流锻炼（见康复篇）。</li></ul>
  <h4>三、发现与处理</h4><p>患肢周径变粗、发沉、皮肤变硬，尽早到<b>淋巴水肿专科/康复科</b>，用手法引流、压力治疗、皮肤护理，越早越好。</p>`},
 {id:'cognitive',title:'"化疗脑"与认知变化',tags:['化疗脑','脑雾','记忆力','注意力','认知','健忘','思绪'],
  body:`<h4>一、表现</h4><p>部分人治疗后出现"脑子不灵光"：忘事、注意力不集中、找词困难、 multitasking 变差，俗称"化疗脑/脑雾"。它真实存在，并非心理作用，也见于内分泌、靶向等治疗。</p>
  <h4>二、应对</h4>
  <ul><li>用备忘录、日历、药盒减轻记忆负担；重要事写下来。</li>
  <li>规律睡眠、适度运动、社交与脑力活动（读书、 puzzles）有助恢复。</li>
  <li>控制焦虑抑郁，必要时心理支持。</li></ul>
  <h4>三、何时就医</h4><p>认知下降进行性加重、伴头痛呕吐或性格改变，需排查脑转移、代谢异常等，及时复诊。</p>`},
 {id:'sex',title:'生育、性功能与治疗相关停经',tags:['生育','卵巢功能','停经','月经','性功能','不孕','备孕','避孕'],
  body:`<h4>一、治疗对生育的影响</h4><p>化疗、盆腔放疗、部分内分泌治疗可能损伤卵巢功能（月经紊乱/停经）或精子生成，年轻患者尤需关注生育力保存。</p>
  <h4>二、可做的准备</h4>
  <ul><li>有生育意愿者，<b>治疗前</b>咨询生殖科：女性可考虑卵子/胚胎冷冻、卵巢移位/药物保护；男性可精子冷冻。</li>
  <li>治疗期间仍可能排卵，需有效避孕（与医生确认安全方式）。</li>
  <li>停经后潮热、盗汗、情绪变化可用激素或对症处理，需权衡肿瘤类型。</li></ul>
  <h4>三、性功能与沟通</h4><p>治疗期性欲下降、干涩、疼痛常见，可与伴侣沟通、用润滑剂，必要时咨询专科。这些话题不"尴尬"，是整体治疗的一部分。</p>`},
 {id:'port',title:'中心静脉导管（PICC/输液港）居家护理',tags:['PICC','输液港','port','中心静脉','导管','维护','静脉'],
  body:`<h4>一、为什么用导管</h4><p>长期输液/化疗常用 PICC（外周置入中心静脉导管）或输液港（Port），保护外周血管、减少反复穿刺。居家护理到位能防感染与血栓。</p>
  <h4>二、居家注意</h4>
  <ul><li>保持穿刺处干燥清洁，洗澡用防水保护；PICC 每周维护冲管一次（按医院安排）。</li>
  <li>避免置管侧提重物、测血压、抽血；睡觉勿压导管侧。</li>
  <li>观察红肿热痛、渗液、敷料松动、臂围变粗（血栓信号）。</li>
  <li>输液港皮肤下摸到硬结、红肿及时就医。</li></ul>
  <h4>三、紧急</h4><p>导管脱出、断裂、穿刺处化脓高热，立即回医院处理，勿自行塞回。</p>`},
 {id:'complementary',title:'保健品、偏方与中西药相互作用',tags:['保健品','中药','偏方','相互作用','乱吃',' supplement','慎用'],
  body:`<h4>一、核心原则</h4><p>治疗期间想"加点补的"很常见，但<b>任何保健品、中药、偏方都可能影响抗癌药疗效或增加毒性</b>，必须先告诉主治医生，不要瞒着自行加用。</p>
  <h4>二、高风险举例</h4>
  <ul><li>圣约翰草（贯叶连翘）会大幅降低多种靶向/内分泌药浓度。</li>
  <li>某些中药（如含肝毒成分）可能加重肝损伤，与化疗叠加风险。</li>
  <li>大剂量抗氧化剂（维 C/E 高剂量）理论上可能削弱放化疗疗效，证据尚不完全，但应避免大剂量补充剂。</li>
  <li>"饿死肿瘤""偏方断根"多无依据且可能延误治疗、加重营养不良。</li></ul>
  <h4>三、安全做法</h4><p>把所有在用的药、保健品、中药列清单（本工具"用药管理"可记），每次复诊出示；只在不冲突、医生知情下使用。取效证据强的支持治疗（如止吐、营养）按医嘱用。</p>`},
 {id:'palliative',title:'缓和医疗与安宁疗护理念',tags:['缓和医疗','安宁疗护','症状控制','生活质量','决策','意愿','临终'],
  body:`<h4>一、缓和医疗不是"放弃"</h4><p>缓和医疗（ palliative care）是<b>全程</b>关注症状控制、疼痛缓解、心理社会支持与决策沟通，可与抗肿瘤治疗同时进行，目的是提高生活质量，并非仅临终才用。</p>
  <h4>二、关注什么</h4>
  <ul><li>积极控制疼痛、恶心、呼吸困难、便秘等症状（见各专题）。</li>
  <li>沟通治疗目标与顾虑，参与决策；了解"预立医疗照护计划/advance care planning"。</li>
  <li>照顾者也同样需要支持，别只盯着病人。</li></ul>
  <h4>三、安宁疗护</h4><p>当进入终末阶段，安宁疗护侧重舒适与尊严，避免过度有创治疗。这些话题越早沟通越从容，建议与家人、医护坦诚交流。</p>`},
 {id:'communicate',title:'如何高效与医生沟通、做好就医准备',tags:['就医','沟通','问诊','复诊','准备','提问','病历'],
  body:`<h4>一、带齐资料</h4><p>复诊带：既往病历、手术/病理报告、历次影像与化验（用本工具"指标跟踪/报告夹"整理好）、当前所有用药清单（含保健品）。</p>
  <h4>二、提前列问题</h4>
  <ul><li>这次治疗目标与方案？副作用有哪些、如何应对？</li>
  <li>复查安排与预警信号？什么情况要立刻回来？</li>
  <li>用药漏服怎么办？哪些药/食物要避开？</li>
  <li>下一步计划与时间节点？</li></ul>
  <h4>三、沟通技巧</h4><p>用本工具"今日待办/提醒"记医嘱；重要决定可请家属同往或录音（征得同意）；拿不准可了解<b>多学科会诊（MDT）</b>与<b>二次诊疗意见</b>。清楚提问比"全听医生的"更能保障安全。</p>`},
 {id:'marker_full',title:'肿瘤标志物全套解读（逐一说明）',tags:['肿瘤标志物','CEA','CA125','CA153','CA199','CA724','CA242','AFP','PSA','fPSA','NSE','CYFRA21-1','SCC','HE4','ProGRP','标志物','指标'],
  body:`<h4>一、总原则</h4><p>标志物升高<b>不等于复发转移</b>（炎症、吸烟、肝肾疾病、月经期、良性病都可能影响）；正常也不代表万事大吉。价值在<b>动态趋势</b>＋结合影像。本工具"指标跟踪"录值看曲线最直观。</p>
  <h4>二、常见标志物与提示</h4>
  <table><tr><th>标志物</th><th>主要相关癌种</th><th>读图要点</th></tr>
  <tr><td>CEA</td><td>结直肠、胃、肺、乳腺腺癌</td><td>广谱；术后正常又升要警惕</td></tr>
  <tr><td>CA125</td><td>卵巢上皮癌</td><td>也受月经/盆腔炎/腹水影响</td></tr>
  <tr><td>CA153 / CA27-29</td><td>乳腺癌</td><td>疗效与随访参考</td></tr>
  <tr><td>CA19-9</td><td>胰腺、胆管、胃结直肠</td><td>黄疸/胰腺炎可假升</td></tr>
  <tr><td>CA72-4 / CA242</td><td>胃肠、卵巢</td><td>辅助，特异性一般</td></tr>
  <tr><td>AFP</td><td>肝细胞癌、生殖细胞肿瘤</td><td>特异性较强</td></tr>
  <tr><td>PSA / fPSA</td><td>前列腺</td><td>fPSA/PSA 比值助鉴别良恶性</td></tr>
  <tr><td>NSE / ProGRP</td><td>小细胞肺癌</td><td>需空腹、溶血影响</td></tr>
  <tr><td>CYFRA21-1</td><td>非小细胞肺癌（鳞癌）</td><td>肾损可升高</td></tr>
  <tr><td>SCC</td><td>宫颈、食管、头颈鳞癌</td><td>皮肤/唾液污染可假升</td></tr>
  <tr><td>HE4</td><td>卵巢</td><td>常与 CA125 联用</td></tr></table>
  <h4>三、怎么跟医生看</h4><p>把历次数值按时间录入，复诊时直接给曲线。单次小波动常见，<b>持续、明显、成趋势</b>的上升更值得关注；最终判断永远结合影像与查体，不自行对号入座。</p>`},
 {id:'liver',title:'肝功能异常解读（ALT/AST/胆红素/白蛋白）',tags:['肝功能','ALT','AST','胆红素','白蛋白','GGT','转氨酶','肝损','肝指标'],
  body:`<h4>一、先看模式</h4>
  <ul><li><b>肝细胞损伤型：</b>ALT、AST 升高为主（药物/病毒/脂肪肝/转移肝）。</li>
  <li><b>胆汁淤积型：</b>ALP、GGT、胆红素升高为主（胆道梗阻、药物）。</li>
  <li><b>合成功能：</b>白蛋白、凝血酶原时间反映肝脏"生产"能力，低了提示较重。</li></ul>
  <h4>二、常见原因</h4><p>化疗/靶向/免疫肝毒、肝转移、病毒性肝炎、脂肪肝、胆道梗阻、药物（包括某些中药）。免疫治疗的肝 irAE 可较重，需早查。</p>
  <h4>三、居家与处理</h4>
  <ul><li>戒酒、避免肝毒药物与偏方；记录指标（本工具建 ALT/AST/胆红素/白蛋白）。</li>
  <li>轻度升高观察复查；明显升高由医生决定减量/暂停/保肝药。</li>
  <li>眼白发黄、茶色尿、极度乏力、腹胀——尽快复诊。</li></ul>`},
 {id:'kidney',title:'肾功能异常解读（肌酐/尿素/eGFR/尿酸）',tags:['肾功能','肌酐','尿素','eGFR','尿酸','肾损','尿蛋白','肾指标'],
  body:`<h4>一、关键指标</h4>
  <ul><li><b>肌酐、尿素：</b>升高提示排泄下降；eGFR 更直接反映肾小球滤过（数值越低肾功能越差）。</li>
  <li><b>尿酸：</b>肿瘤溶解、化疗可骤升致痛风/肾损。</li>
  <li>尿蛋白/血尿需尿常规或 24h 尿蛋白评估。</li></ul>
  <h4>二、常见原因</h4><p>化疗肾毒（顺铂、甲氨蝶呤）、肿瘤溶解综合征、脱水、梗阻（尿路被压）、造影剂、止痛药（NSAIDs）、二甲双胍等。</p>
  <h4>三、居家与处理</h4>
  <ul><li>充足饮水（心肾功能允许），化疗前水化很重要；记录尿量。</li>
  <li>避免肾毒药物（自行用止痛药、某些造影剂）；控制血压血糖。</li>
  <li>eGFR 明显下降、尿少、水肿、血钾升高，由医生调整用药甚至透析评估。</li></ul>`},
 {id:'electrolyte',title:'电解质紊乱（血钾/钠/钙/镁）解读',tags:['电解质','低钾','高钾','低钠','高钠','低钙','高钙','钾','钠','钙','镁','危急值'],
  body:`<h4>一、为什么重要</h4><p>电解质参与心跳、神经肌肉与代谢，<b>严重紊乱可致命（尤其高钾、低钾、高钙）</b>，肿瘤患者因呕吐腹泻、进食差、药物、肿瘤溶解等极易紊乱。</p>
  <h4>二、各指标异常表现</h4>
  <table><tr><th>指标</th><th>常见原因</th><th>表现/危险</th></tr>
  <tr><td>低钾</td><td>呕吐腹泻、利尿剂、进食差</td><td>乏力、腹胀、心律失常</td></tr>
  <tr><td>高钾</td><td>肾损、保钾药、肿瘤溶解</td><td>可致心脏骤停（危急）</td></tr>
  <tr><td>低钠</td><td>饮水多/抗利尿激素异常、呕吐</td><td>嗜睡、抽搐、意识模糊</td></tr>
  <tr><td>高钙</td><td>骨转移、甲状旁腺相关</td><td>多尿、便秘、嗜睡、心律失常</td></tr>
  <tr><td>低镁/低钙</td><td>进食差、利尿剂、碱中毒</td><td>手足抽搐、口周麻</td></tr></table>
  <h4>三、处理</h4><p>轻症口服补充（钾/镁/钙制剂），中重度静脉补；高钾/高钙需急诊处理（降钾药、水化、利尿、双膦酸盐等）。本工具可建各电解质指标跟踪趋势。</p>`},
 {id:'glucolipid',title:'血糖与血脂异常管理',tags:['血糖','空腹血糖','糖化血红蛋白','胆固醇','甘油三酯','高血脂','糖尿病','类固醇','血脂'],
  body:`<h4>一、两类常见问题</h4>
  <ul><li><b>类固醇性高血糖：</b>地塞米松等常致血糖升高，部分人出现"类固醇糖尿病"，需监测。</li>
  <li><b>血脂异常：</b>某些靶向/内分泌治疗、 steroids 可升甘油三酯/胆固醇。</li></ul>
  <h4>二、监测与处理</h4>
  <ul><li>本工具建"空腹血糖、糖化血红蛋白、总胆固醇、甘油三酯、LDL、HDL"跟踪。</li>
  <li>饮食控糖控油（低 GI、少精制糖、限饱和脂肪）；适度运动。</li>
  <li>持续高血糖由医生开降糖药/胰岛素；高血脂用他汀类等，注意与他汀的相互作用与肌痛副作用。</li></ul>
  <h4>三、注意</h4><p>突然极度口渴多尿、意识改变警惕高血糖危象；降脂药致肌痛及时反馈。</p>`},
 {id:'cardiac',title:'心脏毒性与心肌酶/心衰指标',tags:['心脏','心肌酶','CK','肌钙蛋白','BNP','NT-proBNP','心衰','蒽环','曲妥珠','心电'],
  body:`<h4>一、哪些治疗伤心脏</h4><p>蒽环类（多柔比星）、曲妥珠单抗、某些靶向/免疫、胸部放疗可增加心风险，表现为心衰、心律失常、心肌炎，部分不可逆，<b>早监测早干预</b>关键。</p>
  <h4>二、看哪些指标</h4>
  <ul><li><b>肌钙蛋白（cTnI/T）：</b>心肌损伤标志，免疫性心肌炎可显著升。</li>
  <li><b>BNP / NT-proBNP：</b>心衰时升高，反映心脏负荷。</li>
  <li><b>CK / CK-MB：</b>肌肉（含心肌）损伤参考。</li>
  <li>LVEF（超声测射血分数）是核心心功能指标。</li></ul>
  <h4>三、警惕信号与处理</h4><p>气短、平躺喘、腿肿、心悸、极度乏力，及时查心功；新发胸痛/晕厥立即急诊。医生可能用心电、超声、药物保护（如ACEI/β阻滞剂）并调整方案。本工具可建上述指标长期跟踪。</p>`},
 {id:'coag',title:'凝血功能与 D-二聚体解读',tags:['凝血','PT','APTT','INR','D二聚体','纤维蛋白原','抗凝','出血','血栓','凝血指标'],
  body:`<h4>一、指标含义</h4>
  <ul><li><b>PT / INR：</b>外源凝血途径；服华法林者看 INR 调剂量。</li>
  <li><b>APTT：</b>内源途径；肝素治疗监测用。</li>
  <li><b>纤维蛋白原 / 血小板：</b>参与凝血与止血。</li>
  <li><b>D-二聚体：</b>纤维蛋白降解产物，升高提示体内有新血栓形成或溶解。</li></ul>
  <h4>二、临床场景</h4>
  <ul><li><b>出血倾向：</b>PT/APTT 延长、血小板低——见出血预防篇。</li>
  <li><b>血栓排查：</b>D-二聚体明显升+腿肿/胸痛/咯血，警惕深静脉血栓/肺栓塞（见血栓篇）。</li>
  <li><b>弥散性血管内凝血（DIC）：</b>重症可同时出血与血栓，属急症。</li></ul>
  <h4>三、处理</h4><p>抗凝/抗血小板药严格按医嘱，不自行加减；用此类药者注意出血征象与复查凝血。本工具可建 INR、D-二聚体等跟踪。</p>`},
 {id:'thyroid',title:'甲状腺功能异常（TSH/FT3/FT4）',tags:['甲状腺','TSH','FT3','FT4','甲亢','甲减','靶向药','免疫','甲功'],
  body:`<h4>一、谁要查</h4><p>部分靶向药（如酪氨酸激酶抑制剂）、免疫治疗可引起甲状腺功能异常；头颈/甲状腺区放疗也可影响。</p>
  <h4>二、两类表现</h4>
  <ul><li><b>甲减：</b>乏力、怕冷、便秘、浮肿、体重增加、情绪低落——TSH 升高、FT4 低。</li>
  <li><b>甲亢：</b>心慌、怕热、多汗、消瘦、失眠、手抖——TSH 低、FT4 高；免疫性甲状腺炎可先甲亢后甲减。</li></ul>
  <h4>三、处理</h4><p>定期复查甲功（本工具建 TSH/FT3/FT4）；甲减多用左甲状腺素替代，甲亢由医生用抗甲状腺药并监测，严重时暂停相关治疗。症状明显及时复诊。</p>`},
 {id:'inflam',title:'炎症指标（CRP/PCT/ESR）解读',tags:['炎症','CRP','PCT','ESR','降钙素原','感染','发热','C反应蛋白'],
  body:`<h4>一、三个指标</h4>
  <ul><li><b>CRP（C 反应蛋白）：</b>炎症/感染/组织损伤时快速升高，恢复也快，看趋势。</li>
  <li><b>PCT（降钙素原）：</b>更偏向<b>细菌感染</b>鉴别，升高提示细菌感染可能性大、可指导抗生素。</li>
  <li><b>ESR（血沉）：</b>慢性非特异性炎症指标，受贫血等影响，敏感性高特异性低。</li></ul>
  <h4>二、怎么用</h4><p>肿瘤患者发热/不适时，炎症指标帮医生区分感染 vs 肿瘤活动 vs 其他；动态下降常提示治疗有效。注意：肿瘤本身、术后、血栓也会升，需结合临床。本工具可建 CRP/PCT 跟踪。</p>
  <h4>三、提醒</h4><p>炎症指标升高不必恐慌，但伴高热、寒战、局部红肿痛，按感染处理并及时就医（见发热篇）。</p>`},
 {id:'immunonutri',title:'免疫球蛋白与营养指标评估',tags:['免疫球蛋白','IgG','IgA','IgM','铁蛋白','前白蛋白','白蛋白','维生素D','营养','免疫','指标'],
  body:`<h4>一、营养与免疫状态怎么看</h4>
  <ul><li><b>白蛋白 / 前白蛋白：</b>反映近期营养与肝脏合成；前白蛋白更敏感（半衰期短），下降提示摄入不足。</li>
  <li><b>铁蛋白：</b>既反映铁储备，也是炎症/肿瘤活动指标，升高不一定缺铁。</li>
  <li><b>免疫球蛋白（IgG/IgA/IgM）：</b>低下者感染风险高（如多发性骨髓瘤、化疗后）。</li>
  <li><b>维生素 D / B12 / 叶酸：</b>缺乏影响骨健康、神经与造血，可补充。</li></ul>
  <h4>二、处理</h4><p>指标偏低优先从营养入手（高蛋白饮食+ONS，见营养篇）；明确缺乏按医嘱补充。反复感染者可查免疫球蛋白，必要时免疫科会诊。本工具可建上述指标跟踪趋势。</p>`},
 {id:'clinicaltrial',title:'临床试验：是什么、要不要参加',tags:['临床试验','入组','研究','新药','知情同意','GCP','参与'],
  body:`<h4>一、正确认识</h4><p>临床试验是按规定流程验证新疗法安全性与疗效的研究，受伦理与法规（GCP）严格保护。参加是自愿的，可随时退出，<b>不等于"小白鼠"</b>。</p>
  <h4>二、常见类型</h4>
  <ul><li>Ⅰ期（安全性/剂量）、Ⅱ期（初步疗效）、Ⅲ期（对比标准治疗）、Ⅳ期（上市后）。</li>
  <li>也包括真实世界研究、活检/随访研究。</li></ul>
  <h4>三、怎么判断</h4>
  <ul><li>与主治医生讨论是否适合、有哪些获益与风险、随访要求。</li>
  <li>仔细阅读知情同意，弄清费用、分组（可能对照组）、退出权。</li>
  <li>可在国家临床试验登记平台、医院招募公告查询；警惕收费骗局。</li></ul>`}
];
function buildKnowledge(prefill){
  let h=`<div class="view-head"><h2>📚 知识库问答</h2><p>输入你的问题，下面会给出详细的解答（基于健康科普检索）。</p></div>`;
  h+=`<div class="kb-disclaimer">
    <b>⚠️ 使用须知（请先阅读再提问）</b>
    <p>本工具仅做<b>健康科普检索</b>，不对个人病情下结论、不生成处方。依据《互联网诊疗监管细则》，<b>严禁 AI 自动生成处方，也不得冒用医师提供诊疗服务</b>——本网页同样适用。以下回答仅供你<b>与主治医生沟通时参考</b>，任何用药与诊疗决定请遵从专业医师意见。</p>
  </div>`;
  h+=`<div class="card"><div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
    <input id="kbSearch" class="field" style="flex:1;min-width:200px;padding:.7rem 1rem;border:1.5px solid var(--color-border);border-radius:var(--radius-full)" placeholder="如：化疗后白细胞低怎么办？靶向药皮疹怎么处理？" value="${prefill||''}">
    <button class="rc-btn" onclick="runKB()">搜索问答</button>
    <button class="rc-btn ghost sm" onclick="openAISettings()" title="在线智能回答设置">⚙ 在线回答</button>
  </div><div style="font-size:.8rem;margin-top:.6rem" id="aiStatus"></div></div>`;
  h+=`<div id="kbResults">`;
  h+= prefill? runKBInner(prefill) : `<div class="kb-default">你可以直接提问，或点选常见话题：<br>
    ${KB.map(a=>`<span class="topic" onclick="quickKB('${a.id}')">${a.title}</span>`).join('')}
    <div class="disclaimer">⚠️ 内容为健康科普，不能替代专业医疗建议；具体诊疗请遵医嘱。</div></div>`;
  h+=`</div>`;
  setTimeout(updateAIStatus,0);
  return h;
}
function quickKB(id){const a=KB.find(x=>x.id===id);if(!a)return;const q=a.title;if(document.getElementById('kbSearch')){document.getElementById('kbSearch').value=q;runKB();}else{showKBModal(q);}}
function runKB(){const q=(document.getElementById('kbSearch')||{}).value;const el=document.getElementById('kbResults');if(!q||!q.trim()){el.innerHTML='<div class="kb-default">请输入问题。</div>';return;}renderKB(el,q);}
function showKBModal(q){let html=`<div class="view-head" style="margin-bottom:.4rem"><h2>📚 搜索结果</h2></div><div id="kbModalBody"></div><div class="modal-actions"><button class="rc-btn ghost" onclick="closeModal()">关闭</button><button class="rc-btn" onclick="closeModal();showView('knowledge')">在知识库中查看全部</button></div>`;openModal(html);const el=document.getElementById('kbModalBody');if(!q||!q.trim()){el.innerHTML='<div class="kb-default">请输入问题。</div>';return;}renderKB(el,q);}
function renderKB(el,q){const inner=runKBInner(q);if(ai.enabled&&ai.apiKey){el.innerHTML=`<div class="kb-result"><h3>🤖 在线智能回答（实时大模型）</h3><div class="kb-body" id="aiAnswerMB">正在生成详细回答…</div></div>`+inner;callAI(q).then(ans=>{const n=document.getElementById('aiAnswerMB');if(n)n.innerHTML=markdownLite(ans)+`<div class="kb-note">⚠️ 以上为 AI 科普内容，仅作信息参考，不构成诊断或处方，严禁用于自我诊疗；具体方案请遵医嘱。回答可能不够准确。</div>`;}).catch(err=>{const n=document.getElementById('aiAnswerMB');if(n)n.innerHTML='⚠️ 在线回答暂不可用（'+((err&&err.message)?err.message:String(err)).slice(0,100)+'）。已为你显示下方本地知识库内容；若需稳定联网，可将本应用部署到带后端代理的服务器，或使用支持跨域的接口。';});}else{el.innerHTML=inner;}}
function runKBInner(q){
  const ql=q.toLowerCase();
  const scored=KB.map(a=>{let s=0;if(a.title.includes(q))s+=12;a.tags.forEach(t=>{if(q.includes(t)||t.includes(q))s+=6;});const chars=[...new Set(q.replace(/[\s,，。？?、]/g,''))];chars.forEach(c=>{if(c&&(a.title+a.tags.join('')+a.body).includes(c))s+=(a.body.split(c).length-1)*0.4;});return{a,s};}).filter(x=>x.s>0).sort((x,y)=>y.s-x.s);
  if(!scored.length){return `<div class="kb-default">没有找到完全匹配的内容。你可以换几个关键词，或试试这些话题：<br>${KB.slice(0,8).map(a=>`<span class="topic" onclick="quickKB('${a.id}')">${a.title}</span>`).join('')}<div class="disclaimer">⚠️ 科普内容，不替代医生诊断。</div></div>`;}
  let html='';
  scored.slice(0,4).forEach(({a})=>{
    html+=`<div class="kb-result"><h3>${a.title}</h3><div class="kb-tags">${a.tags.map(t=>`<span>#${t}</span>`).join('')}</div><div class="kb-body">${a.body}</div><div class="kb-note">⚠️ 以上为健康科普，不能替代专业诊断与治疗，请务必以主治医生意见为准。</div></div>`;
  });
  return html;
}
function doSearch(q){if(!q||!q.trim()){toast('请输入搜索内容');return;}showKBModal(q.trim());}

/* ===================== 在线 AI（可选增强，OpenAI 兼容接口） ===================== */
const AIKEY='mj_ai_v1';
let ai=loadAI();
function loadAI(){try{const s=JSON.parse(localStorage.getItem(AIKEY));if(s&&typeof s==='object')return s;}catch(e){}return{enabled:false,provider:'deepseek',baseUrl:'https://api.deepseek.com/v1',apiKey:'',model:'deepseek-chat'};}
function saveAI(){try{localStorage.setItem(AIKEY,JSON.stringify(ai));}catch(e){}}
async function callAI(q,cfg){
  const a=cfg||ai;
  if(!a.enabled||!a.apiKey) throw new Error('未配置在线回答');
  const url=(ai.baseUrl||'').replace(/\/$/,'')+'/chat/completions';
  if(!/^https:\/\//.test(url)) throw new Error('接口地址需以 https:// 开头');
  const sys='你是健康科普检索助手，服务对象是肿瘤患者及家属。请只做科普，用通俗易懂、结构清晰（分点/分段、必要时用表格）的详细中文回答，覆盖：这是什么、为什么会发生、居家怎么做、什么时候必须立即就医。严格遵守《互联网诊疗监管细则》：绝不自动生成处方，绝不冒用医师提供诊疗服务，绝不对个人病情下诊断或给出"你应该换药/停药"之类个体化结论。不要编造具体数据或药物剂量；结尾务必强调：以上为科普内容，不替代医生诊疗，具体诊疗请遵医嘱。';
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ai.apiKey},body:JSON.stringify({model:ai.model||'deepseek-chat',messages:[{role:'system',content:sys},{role:'user',content:q}],temperature:0.7,max_tokens:1600})});
  if(!res.ok){let t='';try{t=await res.text();}catch(e){}throw new Error('HTTP '+res.status+' '+t.slice(0,120));}
  const d=await res.json();
  const c=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
  if(!c) throw new Error('接口未返回内容');
  return c;
}
function markdownLite(s){s=esc(s);s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');s=s.replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');return '<p>'+s+'</p>';}
function updateAIStatus(){const el=document.getElementById('aiStatus');if(!el)return;el.innerHTML=ai.enabled&&ai.apiKey?'<span class="pill green">● 在线大模型已开启</span> 回答将优先调用实时 AI，并附本地知识库参考':'<span class="pill amber">● 本地知识库模式</span> 未配置在线回答，使用内置科普库（可在「发现」页点「⚙ 在线回答」开启）';}
function openAISettings(){

  <details class="tut" open><summary>📖 怎么接入 DeepSeek？点开看分步教程</summary>

      <li><b>充值</b>：进入「充值」页面充值（DeepSeek API 是按量计费、价格很低，新账号一般有赠送额度；未充值调用会失败）。</li>
      <li><b>创建密钥</b>：左侧菜单「API keys」→「创建 API key」→ 复制生成的 <code>sk-xxxx</code> 密钥。<b>密钥只显示一次，请立即保存好</b>。</li>
      <li><b>填到本弹窗</b>：下方「服务商」选 <b>DeepSeek</b>（Base URL 与模型名会自动填好：<code>https://api.deepseek.com/v1</code> 与 <code>deepseek-chat</code>），把密钥粘贴进「API Key」，「启用在线回答」选「开启」，点「保存并测试」。</li>
      <li><b>开始用</b>：回到「知识库问答」页提问，回答区顶部会出现「🤖 在线智能回答（实时大模型）」，下方同时附本地知识库。</li>
    </ol>
    <div class="tut-note">⚠️ <b>关于浏览器跨域（CORS）：</b>网页直接调用 DeepSeek 接口常被浏览器以「CORS 拦截」拒绝（控制台报 blocked by CORS），此时会自动降级到本地知识库。想稳定联网，请用本目录附带的本地代理 <code>ai_proxy.py</code>：<br>
    ① 终端运行 <code>python3 ai_proxy.py</code>（Python 自带、无需装依赖）；<br>

    亦可将本应用部署到有后端的服务器做代理。详见同目录 <code>AI接入教程.md</code>。</div>
  </details>
  <div class="grid-form">
    <div class="field"><label>启用在线回答</label><select id="ai_en"><option value="1" ${ai.enabled?'selected':''}>开启</option><option value="0" ${!ai.enabled?'selected':''}>关闭</option></select></div>
    <div class="field"><label>服务商</label><select id="ai_pv" onchange="applyAIPreset(this.value)">
      <option value="deepseek" ${ai.provider==='deepseek'?'selected':''}>DeepSeek</option>
      <option value="openai" ${ai.provider==='openai'?'selected':''}>OpenAI</option>
      <option value="qwen" ${ai.provider==='qwen'?'selected':''}>通义千问</option>
      <option value="custom" ${ai.provider==='custom'?'selected':''}>自定义</option></select></div>
    <div class="field"><label>接口地址 (Base URL)</label><input id="ai_url" value="${ai.baseUrl}"></div>
    <div class="field"><label>模型名</label><input id="ai_model" value="${ai.model}"></div>
    <div class="field" style="grid-column:1/-1"><label>API Key</label><input id="ai_key" type="password" value="${ai.apiKey}" placeholder="sk-..."></div>
  </div>
  <div id="aiTestResult" style="font-size:.82rem;margin:.4rem 0;min-height:1rem"></div>
  <div class="modal-actions"><button class="rc-btn ghost" onclick="closeModal()">取消</button><button class="rc-btn ghost" onclick="testAI()">保存并测试</button><button class="rc-btn" onclick="saveAISettings()">仅保存</button></div>`;
  openModal(h);
}
async function testAI(){
  const el=document.getElementById('aiTestResult');
  const cfg={enabled:document.getElementById('ai_en').value==='1',provider:document.getElementById('ai_pv').value,baseUrl:document.getElementById('ai_url').value.trim(),model:document.getElementById('ai_model').value.trim(),apiKey:document.getElementById('ai_key').value.trim()};
  if(!cfg.apiKey){el.innerHTML='⚠️ 请先填写 API Key';return;}
  el.innerHTML='⏳ 正在测试连接（用表单中的配置）…';
  try{const ans=await callAI('请用一句话说明肿瘤患者居家护理最重要的三点。',cfg);el.innerHTML='✅ 连接成功！模型返回：'+esc(ans.slice(0,80))+(ans.length>80?'…':'');}
  catch(err){el.innerHTML='❌ 测试失败：'+esc(((err&&err.message)?err.message:String(err)).slice(0,160))+'（多为 CORS 跨域或 Key/余额问题；建议改用本地代理 ai_proxy.py，见教程）';}
}
function applyAIPreset(pv){const presets={deepseek:{url:'https://api.deepseek.com/v1',model:'deepseek-chat'},openai:{url:'https://api.openai.com/v1',model:'gpt-4o-mini'},qwen:{url:'https://dashscope.aliyuncs.com/compatible-mode/v1',model:'qwen-plus'},custom:{url:'',model:''}};const p=presets[pv];if(p){document.getElementById('ai_url').value=p.url;document.getElementById('ai_model').value=p.model;}}
function saveAISettings(){ai.enabled=document.getElementById('ai_en').value==='1';ai.provider=document.getElementById('ai_pv').value;ai.baseUrl=document.getElementById('ai_url').value.trim();ai.model=document.getElementById('ai_model').value.trim();ai.apiKey=document.getElementById('ai_key').value.trim();saveAI();closeModal();toast('已保存');if(document.getElementById('kbSearch'))updateAIStatus();}

/* ===================== 通用工具 ===================== */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2200);}
function openModal(html){const m=document.getElementById('modal');document.getElementById('modalBody').innerHTML=html;m.classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function confirmModal(title,onYes){window._cfYes=onYes;openModal(`<h3>${title}</h3><div class="modal-actions"><button class="rc-btn ghost" onclick="closeModal();window._cfYes=null">取消</button><button class="rc-btn" onclick="closeModal();var f=window._cfYes;window._cfYes=null;if(f)f()">确定</button></div>`);}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.target.classList.remove('show');});

/* ===================== 动效：点击 ripple ===================== */
function attachRipple(){
  document.addEventListener('click', e=>{
    const el=e.target.closest('.rc-btn, button, .topic, .chip, .stat, .ri-del, .mod-card, .ig-item, .dock-item, .more-chip');
    if(!el)return;
    const cs=getComputedStyle(el);
    if(cs.position==='static')el.style.position='relative';
    if(cs.overflow!=='hidden')el.style.overflow='hidden';
    const r=el.getBoundingClientRect();
    const size=Math.max(r.width,r.height);
    const sp=document.createElement('span');sp.className='ripple';
    sp.style.width=sp.style.height=size+'px';
    sp.style.left=(e.clientX-r.left-size/2)+'px';
    sp.style.top=(e.clientY-r.top-size/2)+'px';
    el.appendChild(sp);
    setTimeout(()=>sp.remove(),600);
  }, true);
}

/* ===================== 字号 / 隐私锁 ===================== */
function applyFontScale(){const fs=state._fs||'std';const map={std:'16px',lg:'18px',xl:'21px'};document.documentElement.style.fontSize=map[fs]||'16px';}
function setFont(f){state._fs=f;save();applyFontScale();if(current==='hub_me')showView('hub_me');else toast('字号已切换为'+(f==='std'?'标准':f==='lg'?'大':'超大'));}
function hashPin(p){let h=2166136261;const s='mj_rehab_pin_'+p;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function bufToB64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function b64ToBuf(b64){const s=atob(b64);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b.buffer;}
function cryptoRand(){const a=new Uint8Array(32);(crypto||window.crypto).getRandomValues(a);return a;}
/* 隐私锁：全屏解锁层 */
let _pinBuf='';
function showLock(){
  if(document.getElementById('lockScreen'))return;
  const hasBio=!!(window.PublicKeyCredential&&state._pinCred);
  const el=document.createElement('div');el.id='lockScreen';el.className='lock-screen';
  el.innerHTML=`<div class="lock-box">
    <div class="lock-logo">🌿</div>
    <div class="lock-title">肿瘤康复助手</div>
    <div class="lock-sub">已开启隐私锁，请输入 4 位密码解锁</div>
    <div class="lock-dots" id="lockDots"><i></i><i></i><i></i><i></i></div>
    <div class="lock-err" id="lockErr"></div>
    <div class="lock-pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,''].map(k=>k===''?'<span></span>':`<button type="button" class="lk" data-k="${k}">${k}</button>`).join('')}</div>
    ${hasBio?'<button class="rc-btn ghost lock-bio" onclick="unlockBio()">🔓 用指纹/面容解锁</button>':'<div style="font-size:.74rem;color:var(--muted);margin-top:.4rem">也可在「我的 → 隐私锁」开启指纹/面容解锁</div>'}
  </div>`;
  document.body.appendChild(el);
  el.querySelectorAll('.lk').forEach(b=>b.onclick=()=>lockKey(b.dataset.k));
  _pinBuf='';renderLockDots();
}
function renderLockDots(){const d=document.getElementById('lockDots');if(d)d.querySelectorAll('i').forEach((it,i)=>it.className=i<_pinBuf.length?'on':'');}
function lockKey(k){
  const e=document.getElementById('lockErr');if(e)e.textContent='';
  if(k==='⌫'){_pinBuf=_pinBuf.slice(0,-1);renderLockDots();return;}
  if(_pinBuf.length>=4)return;
  _pinBuf+=k;renderLockDots();
  if(_pinBuf.length===4)setTimeout(verifyPin,120);
}
function verifyPin(){
  if(hashPin(_pinBuf)===state._pin){unlockApp();return;}
  _pinBuf='';renderLockDots();
  const e=document.getElementById('lockErr');if(e)e.textContent='密码错误，请重试';
  const b=document.getElementById('lockScreen');if(b){b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),420);}
}
function unlockApp(){const el=document.getElementById('lockScreen');if(el)el.remove();}
/* 设置 / 修改 PIN：通用密码录入弹窗 */
function pinModal(title,onDone){
  openModal(`<h3>${title}</h3><div class="lock-dots" id="pmDots"><i></i><i></i><i></i><i></i></div>
    <div class="lock-err" id="pmErr" style="min-height:1rem;text-align:center"></div>
    <div class="lock-pad" id="pmPad">${[1,2,3,4,5,6,7,8,9,'⌫',0,''].map(k=>k===''?'<span></span>':`<button type="button" class="lk" data-k="${k}">${k}</button>`).join('')}</div>
    <div class="modal-actions"><button class="rc-btn ghost" onclick="closeModal()">取消</button></div>`);
  let buf='';
  const dots=()=>{const d=document.getElementById('pmDots');if(d)d.querySelectorAll('i').forEach((it,i)=>it.className=i<buf.length?'on':'');};
  const pad=document.getElementById('pmPad');
  pad.querySelectorAll('.lk').forEach(b=>b.onclick=()=>{
    const e=document.getElementById('pmErr');if(e)e.textContent='';
    const k=b.dataset.k;
    if(k==='⌫'){buf=buf.slice(0,-1);dots();return;}
    if(buf.length>=4)return;
    buf+=k;dots();
    if(buf.length===4)setTimeout(()=>{closeModal();onDone(buf);},150);
  });
  dots();
}
function setupPin(){pinModal('设置 4 位隐私密码',p1=>pinModal('再输入一次以确认',p2=>{
  if(p1!==p2){toast('两次输入不一致，请重试');return;}
  state._pin=hashPin(p1);save();toast('隐私锁已开启');showView('hub_me');
}));}
function changePin(){pinModal('输入当前密码以修改',cur=>{if(hashPin(cur)!==state._pin){toast('当前密码错误');return;}pinModal('设置新的 4 位密码',p1=>pinModal('再输入一次确认',p2=>{if(p1!==p2){toast('两次不一致');return;}state._pin=hashPin(p1);save();toast('密码已修改');showView('hub_me');}));});}
function disablePin(){confirmModal('确定关闭隐私锁吗？关闭后他人可直接查看病情数据。',()=>{state._pin=null;state._pinCred=null;save();toast('隐私锁已关闭');showView('hub_me');});}
function enrollBio(){
  if(!window.PublicKeyCredential){toast('当前环境不支持指纹/面容（需 HTTPS 或本机 App）');return;}
  if(!state._pin){toast('请先设置 4 位密码，再启用指纹');return;}
  (window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable?window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable():Promise.resolve(true)).then(ok=>{
    if(!ok){toast('本设备未提供指纹/面容能力');return;}
    return navigator.credentials.create({publicKey:{
      challenge:cryptoRand(),rp:{name:'肿瘤康复助手'},
      user:{id:new Uint8Array(16),name:'local',displayName:'local'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000,attestation:'none'
    }});
  }).then(cred=>{
    if(!cred)return;
    state._pinCred=bufToB64(cred.rawId);save();toast('指纹/面容已启用');showView('hub_me');
  }).catch(e=>toast('启用失败：'+(e&&e.message?e.message:String(e))));
}
function removeBio(){state._pinCred=null;save();toast('已关闭指纹/面容解锁');showView('hub_me');}
function unlockBio(){
  if(!state._pinCred){toast('未启用指纹');return;}
  navigator.credentials.get({publicKey:{
    challenge:cryptoRand(),
    allowCredentials:[{type:'public-key',id:b64ToBuf(state._pinCred)}],
    userVerification:'required',timeout:60000
  }}).then(()=>unlockApp()).catch(e=>toast('指纹验证失败：'+(e&&e.message?e.message:String(e))));
}

/* ===================== 初始化 ===================== */
attachRipple();
renderDock();
applyFontScale();
if(!readOnlyBootstrap())showView('dashboard');
if(state._pin)showLock();
// 进入页面后渲染上传列表
setTimeout(()=>{renderUploadList('reports');renderUploadList('docs');},0);
// 提醒：若已授权则启动轮询，并在进入页面时检查一次今天到期的提醒
if(typeof Notification!=='undefined'&&Notification.permission==='granted')startReminderTimer();
setTimeout(()=>checkReminders(false),800);
// 备份周期提醒（每 30 天 / 从未备份过）
setTimeout(backupNudge,1500);
</script>
