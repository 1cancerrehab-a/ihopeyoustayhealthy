<!-- 肿瘤康复助手 — 肿瘤患者病情记录工具（全功能版） -->
<!-- 纯前端单页应用：本地存储、指标趋势图、详尽科普知识库搜索，无后端依赖 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>肿瘤康复助手 · Ihopeyoustayhealthy — 肿瘤患者病情记录</title>
<style>
  /* ===================== 设计令牌：暖阳康复风 ===================== */
  :root{
    --ink:#2d5f7d;            /* 藏青标题 */
    --ink-2:#3e7292;
    --text:#456a7c;           /* 正文 */
    --muted:#93a9b4;          /* 弱化文字 */
    --green:#79bb96; --green-deep:#4f9678; --green-soft:#e7f4ec;
    --orange:#ef9f5b; --orange-soft:#fdf0e2;
    --blue:#5f92c9;  --blue-soft:#e9f1f9;
    --card:rgba(255,255,255,.76);
    --card-strong:rgba(255,255,255,.94);
    --line:rgba(148,172,184,.18);
    --radius:22px; --radius-sm:15px; --radius-full:999px;
    --shadow:0 10px 28px rgba(186,164,140,.16),0 2px 6px rgba(186,164,140,.08);
    --shadow-sm:0 4px 14px rgba(186,164,140,.14);
    --shadow-dock:0 14px 36px rgba(150,130,110,.24);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{
    scroll-behavior:smooth;
    background:#f7f1e5;
    background-image:linear-gradient(180deg,#f7f1e5,#efe8da);
    min-height:100%;
  }
  body{overflow-x:hidden;overscroll-behavior-y:contain;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--text);min-height:100vh;line-height:1.6;
    background:linear-gradient(180deg,#f7f1e5 0%,#efe8da 100%);
    background-image:
      radial-gradient(880px 560px at 88% -6%, rgba(243,186,124,.38), transparent 65%),
      radial-gradient(760px 500px at -12% 14%, rgba(168,214,204,.32), transparent 60%),
      radial-gradient(820px 620px at 50% 112%, rgba(184,209,235,.28), transparent 62%),
      linear-gradient(180deg,#f7f1e5,#efe8da);
    background-attachment:scroll;
  }
  /* 固定全屏背景层：始终铺满视口，滚动/回弹/外壳环境下都不会露白 */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,#f7f1e5 0%,#efe8da 100%);
    background-image:
      radial-gradient(880px 560px at 88% -6%, rgba(243,186,124,.38), transparent 65%),
      radial-gradient(760px 500px at -12% 14%, rgba(168,214,204,.32), transparent 60%),
      radial-gradient(820px 620px at 50% 112%, rgba(184,209,235,.28), transparent 62%),
      linear-gradient(180deg,#f7f1e5,#efe8da);
  }
  /* 手机列布局 */
  .phone{max-width:520px;margin:0 auto;padding:max(.35rem,env(safe-area-inset-top)) max(1.1rem,env(safe-area-inset-right)) calc(118px + env(safe-area-inset-bottom)) max(1.1rem,env(safe-area-inset-left));min-height:100dvh;position:relative}
  .content.view-in{animation:viewIn .46s cubic-bezier(.22,1,.36,1)}
  @keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

  /* ===================== 底部 Tab 栏 ===================== */
  .dock{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    width:min(482px,calc(100% - 26px));display:flex;padding:.5rem .45rem;z-index:130;
    background:rgba(255,255,255,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.95);border-radius:26px;box-shadow:var(--shadow-dock);
  }
  .dock-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.42rem 0 .34rem;
    color:#a5b6bf;cursor:pointer;border-radius:16px;font-size:.66rem;font-weight:600;transition:color .2s,background .2s,transform .1s;user-select:none}
  .dock-item svg{transition:transform .2s}
  .dock-item:active{transform:scale(.92)}
  .dock-item.active{color:var(--green-deep);background:var(--green-soft)}

  /* ===================== 内页顶部返回 ===================== */
  .page-top{display:flex;align-items:center;gap:.7rem;margin:.1rem 0 .9rem;color:var(--ink);font-weight:700;font-size:1rem}
  .back-btn{width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.9);cursor:pointer;
    background:rgba(255,255,255,.8);color:var(--ink);display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s}
  .back-btn:active{transform:scale(.9)}

  /* ===================== 首页问候 ===================== */
  .greet{padding:.7rem .2rem .9rem}
  .greet h1{font-size:clamp(1.5rem,7vw,2rem);line-height:1.3;color:var(--ink);font-weight:800;letter-spacing:.015em}
  .greet .greet-sub{margin-top:.35rem;font-size:.85rem;color:var(--muted)}
  .greet .greet-sub b{color:var(--orange);font-weight:700}

  /* ===================== 通用卡片 ===================== */
  .card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:translateZ(0);
    border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:1.05rem 1.1rem;margin-bottom:1rem;transition:box-shadow .25s,transform .25s}
  .card h3{font-size:.95rem;color:var(--ink);font-weight:700;margin-bottom:.7rem}
  .view-head{margin-bottom:1rem;padding:0 .1rem}
  .view-head h2{font-size:1.3rem;color:var(--ink);font-weight:800}
  .view-head p{font-size:.84rem;color:var(--muted);margin-top:.25rem;line-height:1.7}
  .view-head.hero{background:linear-gradient(130deg,rgba(231,244,236,.9),rgba(233,241,249,.9));border:1px solid rgba(255,255,255,.9);
    border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow-sm)}
  .section-title{font-size:1rem;font-weight:800;color:var(--ink);margin:1.15rem .15rem .7rem;display:flex;align-items:baseline;gap:.5rem}
  .st-sub{font-size:.74rem;color:var(--muted);font-weight:400}

  /* ===================== 首页：进度环 ===================== */
  .hero-card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:translateZ(0);
    border:1px solid rgba(255,255,255,.92);border-radius:26px;box-shadow:var(--shadow);
    padding:1.5rem 1rem;display:flex;flex-direction:column;align-items:center;margin-bottom:1rem}
  .hero-card .hero-cta{margin-top:.85rem}
  .ring-wrap{position:relative;width:200px;height:200px}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:rgba(151,181,168,.18);stroke-width:9}
  .ring-val{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1)}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring-center .rc-label{font-size:.95rem;color:var(--ink);font-weight:700}
  .ring-center .rc-val{font-size:clamp(1.9rem,9.5vw,2.35rem);font-weight:800;color:var(--ink);line-height:1.15}
  .ring-center .rc-val small{font-size:1.05rem;font-weight:700;color:var(--ink-2)}
  .ring-center .rc-sub{font-size:.68rem;color:var(--muted);margin-top:.15rem}

  /* ===================== 首页：双统计卡 ===================== */
  .duo-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;margin-bottom:1rem}
  .stat{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:translateZ(0);
    border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:.95rem 1rem;cursor:pointer;transition:transform .18s,box-shadow .18s}
  .stat:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(186,164,140,.22)}
  .stat:active{transform:scale(.97)}
  .stat .s-top{font-size:.8rem;color:var(--ink);font-weight:700;margin-bottom:.3rem}
  .stat .s-val{font-size:clamp(1.9rem,10.5vw,2.3rem);font-weight:800;line-height:1.15;color:var(--ink)}
  .stat .s-val small{font-size:.95rem;font-weight:700;margin-left:.15rem}
  .stat .s-val.orange{color:var(--orange)}
  .stat .s-val.green{color:var(--green-deep)}
  .stat .s-sub{font-size:.7rem;color:var(--muted);margin-top:.3rem;line-height:1.5}
  /* 用药打卡分段条 */
  .seg{display:flex;gap:.3rem;margin-top:.45rem}
  .seg span{height:9px;flex:1;border-radius:99px;background:rgba(151,181,168,.22)}
  .seg span.on{background:linear-gradient(90deg,#8ec9a5,var(--green-deep))}

  /* ===================== 首页：指标曲线卡 ===================== */
  .chart-card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:translateZ(0);
    border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:1rem 1.05rem .8rem;margin-bottom:1rem;cursor:pointer;transition:transform .18s,box-shadow .18s}
  .chart-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(186,164,140,.22)}
  .chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;flex-wrap:wrap}
  .chart-head .ch-title{font-size:1.02rem;font-weight:800;color:var(--ink)}
  .chart-head .ch-now{font-size:.8rem;color:var(--muted)}
  .chart-head .ch-now b{color:var(--blue);font-size:1.25rem;font-weight:800;margin:0 .1rem}
  .trend-tag{display:inline-block;font-size:.68rem;font-weight:600;border-radius:99px;padding:.1rem .6rem;margin-top:.3rem}
  .trend-tag.flat{background:var(--green-soft);color:var(--green-deep)}
  .trend-tag.up{background:var(--orange-soft);color:#d97f2e}
  .trend-tag.down{background:var(--blue-soft);color:var(--blue)}
  .wave{width:100%;height:auto;display:block;margin-top:.5rem}
  .grid-line{stroke:rgba(151,181,168,.22);stroke-width:1;stroke-dasharray:2 5;stroke-linecap:round}
  .wave-line{stroke:#7cbf9a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .wave-dot{fill:#fff;stroke:#7cbf9a;stroke-width:1.6}
  .wave-dot.last{fill:#4f9678;stroke:#fff;stroke-width:2.4}
  .chart-note{font-size:.68rem;color:var(--muted);margin-top:.45rem;text-align:center}

  /* ===================== 首页：功能图标网格 ===================== */
  .icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:.4rem}
  .ig-item{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:translateZ(0);
    border:1px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:var(--shadow-sm);
    display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.85rem .3rem .7rem;cursor:pointer;
    transition:transform .18s,box-shadow .18s}
  .ig-item:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .ig-item:active{transform:scale(.93)}
  .ig-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--green-soft);color:var(--green-deep)}
  .ig-icon.alt{background:var(--blue-soft);color:var(--blue)}
  .ig-icon.warm{background:var(--orange-soft);color:#d97f2e}
  .ig-t{font-size:.76rem;font-weight:600;color:var(--ink)}

  /* 更多功能横滑条 */
  .more-row{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem .1rem .2rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .more-row::-webkit-scrollbar{display:none}
  .more-chip{flex-shrink:0;display:flex;align-items:center;gap:.3rem;font-size:.78rem;font-weight:600;color:var(--ink-2);
    background:var(--card-strong);border:1px solid rgba(255,255,255,.95);border-radius:99px;padding:.42rem .85rem;
    box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s}
  .more-chip:active{transform:scale(.94)}

  /* ===================== Hub 页模块列表 ===================== */
  .hub-grid{display:flex;flex-direction:column;gap:.75rem}
  .mod-card{display:flex;align-items:center;gap:.9rem;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:translateZ(0);border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:var(--shadow-sm);
    padding:.95rem 1rem;cursor:pointer;transition:transform .18s,box-shadow .18s;position:relative}
  .mod-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .mod-card:active{transform:scale(.98)}
  .mc-icon{width:44px;height:44px;border-radius:14px;background:var(--green-soft);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mc-body{flex:1;min-width:0}
  .mc-title{font-weight:700;color:var(--ink);font-size:.95rem}
  .mc-desc{font-size:.74rem;color:var(--muted);margin-top:.1rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mc-go{color:#c3d2d9;font-weight:700;font-size:1.2rem}

  /* ===================== 搜索与知识库 ===================== */
  .search{display:flex;align-items:center;gap:.5rem;background:var(--card-strong);border:1px solid rgba(255,255,255,.95);
    border-radius:var(--radius-full);padding:.4rem .5rem .4rem 1rem;box-shadow:var(--shadow-sm)}
  .search input{flex:1;border:none;outline:none;background:transparent;font-size:.9rem;color:var(--text);min-width:0}
  .search input::placeholder{color:#adc0c9}
  .kb-tags{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.8rem}
  .topic{display:inline-block;font-size:.76rem;font-weight:600;background:var(--green-soft);color:var(--green-deep);
    border:1px solid rgba(121,187,150,.35);border-radius:99px;padding:.3rem .75rem;cursor:pointer;transition:transform .15s,background .15s}
  .topic:hover{background:#dcefe3}
  .topic:active{transform:scale(.94)}
  .kb-disclaimer{background:linear-gradient(135deg,rgba(253,240,226,.9),rgba(255,255,255,.85));border:1px solid rgba(239,159,91,.35);border-radius:var(--radius-sm);padding:.8rem .95rem;font-size:.8rem;color:var(--text);line-height:1.7;margin-bottom:.9rem}
  .kb-disclaimer b{color:#c2702f}
  .kb-disclaimer p{margin-top:.3rem}
  .kb-result{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:1rem 1.1rem;margin-bottom:.9rem}
  .kb-result h3{color:var(--ink);font-size:.95rem;margin-bottom:.5rem}
  .kb-body{font-size:.88rem;line-height:1.85;color:var(--text)}
  .kb-body b{color:var(--ink)}
  .kb-note{margin-top:.6rem;font-size:.76rem;color:var(--orange);background:var(--orange-soft);border-radius:10px;padding:.45rem .7rem}
  .kb-default{font-size:.86rem;line-height:2;color:var(--muted)}
  .pill{display:inline-block;font-size:.7rem;font-weight:700;border-radius:99px;padding:.16rem .65rem;vertical-align:middle}
  .pill.green{background:var(--green-soft);color:var(--green-deep)}
  .pill.amber{background:var(--orange-soft);color:#d97f2e}
  .pill.red{background:#fde8e4;color:#d95c48}

  /* ===================== 表单 ===================== */
  .grid-form{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .field{display:flex;flex-direction:column;gap:.3rem}
  .field label{font-size:.76rem;font-weight:600;color:var(--ink-2)}
  .field input,.field select,.field textarea,input.field,select.field,textarea.field{
    width:100%;border:1.5px solid var(--line);border-radius:13px;padding:.6rem .8rem;font-size:.88rem;color:var(--text);
    background:rgba(255,255,255,.9);outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s}
  .field input:focus,.field select:focus,.field textarea:focus,input.field:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(121,187,150,.18)}
  .field textarea{resize:vertical;min-height:64px}
  .grid-form .field[style*="grid-column"]{grid-column:1/-1}
  @media(max-width:400px){.grid-form{grid-template-columns:1fr}}
  .date-wrap{display:flex;gap:.4rem;align-items:stretch}
  .date-wrap input[type=text]{flex:1;min-width:0}
  .date-btn{flex:none;border:1.5px solid var(--line);background:rgba(255,255,255,.9);border-radius:13px;padding:0 .6rem;font-size:1rem;cursor:pointer;transition:border-color .2s,box-shadow .2s}
  .date-btn:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(121,187,150,.18)}
  .date-native{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

  /* ===================== 按钮 ===================== */
  .rc-btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
    background:linear-gradient(135deg,#8ec9a5,#4f9678);color:#fff;border:none;border-radius:var(--radius-full);
    padding:.62rem 1.3rem;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 16px rgba(79,150,120,.32);transition:transform .15s,box-shadow .15s,opacity .15s}
  .rc-btn:hover{opacity:.94;box-shadow:0 8px 20px rgba(79,150,120,.38)}
  .rc-btn:active{transform:scale(.95)}
  .rc-btn.ghost{background:var(--card-strong);color:var(--green-deep);border:1.5px solid rgba(121,187,150,.45);box-shadow:none}
  .rc-btn.ghost:hover{background:var(--green-soft)}
  .rc-btn.sm{padding:.34rem .85rem;font-size:.76rem}
  .btn-row{display:flex;flex-wrap:wrap;gap:.55rem}

  /* ===================== 列表 ===================== */
  .list{display:flex;flex-direction:column;gap:.55rem}
  .list-item{display:flex;align-items:flex-start;gap:.6rem;background:rgba(255,255,255,.78);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:.7rem .85rem;transition:border-color .2s}
  .list-item:hover{border-color:rgba(121,187,150,.5)}
  .li-main{flex:1;min-width:0;font-size:.86rem;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
  .li-main .chip{font-size:.72rem;background:rgba(233,241,249,.85);color:var(--ink-2);border-radius:8px;padding:.12rem .5rem;font-weight:600}
  .li-main .chip b{margin-right:.2rem}
  .ri-del{border:none;background:transparent;cursor:pointer;font-size:.9rem;opacity:.45;transition:opacity .15s,transform .15s;padding:.2rem}
  .ri-del:hover{opacity:1;transform:scale(1.12)}
  .empty-tip{font-size:.82rem;color:var(--muted);text-align:center;padding:1rem 0}
  .todo-item{display:flex;align-items:center;gap:.55rem;background:rgba(255,255,255,.78);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:.6rem .8rem;font-size:.85rem;flex-wrap:wrap}
  .disclaimer{font-size:.74rem;color:var(--muted);margin-top:.9rem;text-align:center}

  /* ===================== 图表（指标页） ===================== */
  .charts-grid{display:flex;flex-direction:column;gap:.9rem}
  .chart-box{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transform:translateZ(0);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);
    box-shadow:var(--shadow-sm);padding:1rem;position:relative;transition:box-shadow .2s,transform .2s}
  .chart-box:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
  .chart-box.demo::after{content:"示例数据";position:absolute;top:.7rem;right:.7rem;font-size:.65rem;color:var(--green-deep);background:var(--green-soft);border-radius:8px;padding:.1rem .5rem;font-weight:600;pointer-events:none;z-index:2}
  .chart-box.demo .chart-title{padding-right:4.8rem}
  .chart-box.mint{background:linear-gradient(160deg,rgba(231,244,236,.85),rgba(255,255,255,.85))}
  .chart-title{font-size:.9rem;font-weight:700;color:var(--ink);margin-bottom:.3rem;display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
  .chart-values{font-size:.72rem;color:var(--muted);display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:.4rem}
  .chart-values b{color:var(--blue)}
  .chart-box svg.line-chart{width:100%;height:auto;display:block}

  /* ===================== 我的页 ===================== */
  .me-profile{display:flex;align-items:center;gap:.9rem;cursor:pointer}
  .me-avatar{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#8ec9a5,#5f92c9);color:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .me-info{flex:1;min-width:0}
  .me-info b{display:block;color:var(--ink);font-size:1.02rem}
  .me-info small{color:var(--muted);font-size:.76rem}
  .tip-line{font-size:.74rem;color:var(--muted);margin-top:.6rem;line-height:1.6}

  /* ===================== 弹窗 / Toast / 提醒横幅 ===================== */
  .overlay{position:fixed;inset:0;background:rgba(70,90,100,.32);backdrop-filter:blur(6px);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s}
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{background:rgba(255,255,255,.97);border-radius:24px;box-shadow:0 24px 60px rgba(60,70,80,.3);
    width:min(560px,100%);max-height:86vh;overflow-y:auto;padding:1.3rem 1.25rem;transform:translateY(16px) scale(.97);transition:transform .28s cubic-bezier(.22,1,.36,1)}
  .overlay.show .modal{transform:none}
  .modal h3{color:var(--ink);font-size:1.05rem;margin-bottom:.6rem}
  .modal p{font-size:.85rem}
  .modal-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
  .toast{position:fixed;bottom:104px;left:50%;transform:translate(-50%,14px);background:rgba(45,95,125,.92);color:#fff;
    font-size:.84rem;border-radius:99px;padding:.55rem 1.25rem;z-index:300;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 10px 26px rgba(45,95,125,.35);max-width:86%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .notify-banner{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);z-index:400;width:min(460px,calc(100% - 24px));
    background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);
    border-radius:18px;box-shadow:0 16px 40px rgba(60,70,80,.28);padding:.85rem 1rem;display:flex;gap:.7rem;align-items:flex-start;font-size:.86rem;color:var(--text);
    opacity:0;visibility:hidden;pointer-events:none;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .3s,visibility .3s}
  .notify-banner.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
  .notify-banner .nb-icon{font-size:1.3rem}
  .notify-banner .nb-close{margin-left:auto;cursor:pointer;color:var(--muted);font-size:1.1rem;padding:.1rem .3rem}

  /* ===================== AI 教程 / 导出选择 ===================== */
  .tut{background:rgba(233,241,249,.7);border:1px solid rgba(121,187,150,.3);border-radius:var(--radius-sm);padding:.8rem .95rem;margin:.7rem 0;font-size:.84rem}
  .tut summary{cursor:pointer;font-weight:700;color:var(--ink)}
  .tut-steps{margin:.6rem 0 .2rem 1.3rem;display:flex;flex-direction:column;gap:.45rem;font-size:.82rem;line-height:1.75}
  .tut-note{background:var(--orange-soft);border-radius:10px;padding:.55rem .75rem;font-size:.78rem;line-height:1.7;margin-top:.6rem}
  .exp-list{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.3rem}
  .exp-item{display:flex;align-items:flex-start;gap:.55rem;background:rgba(255,255,255,.85);border:1.5px solid var(--line);
    border-radius:var(--radius-sm);padding:.65rem .75rem;cursor:pointer;font-size:.86rem;transition:border-color .15s,background .15s}
  .exp-item:hover{border-color:rgba(121,187,150,.55);background:var(--green-soft)}
  .exp-item input{margin-top:.25rem;accent-color:var(--green-deep);width:1rem;height:1rem}
  .exp-item b{display:block;color:var(--ink);font-size:.84rem}
  .exp-item small{color:var(--muted);font-size:.72rem;line-height:1.5}
  @media(max-width:400px){.exp-list{grid-template-columns:1fr}}

  /* ===================== 制作署名 / 联系作者 ===================== */
  .made-by{display:flex;gap:.6rem;align-items:flex-start;background:linear-gradient(130deg,rgba(231,244,236,.8),rgba(253,240,226,.8));
    border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);padding:.85rem 1rem;font-size:.8rem;line-height:1.75;color:var(--text);
    box-shadow:var(--shadow-sm);margin-bottom:1rem}
  .made-by b{color:var(--green-deep)}
  .mb-emoji{font-size:1.15rem}
  .contact-card{display:flex;align-items:center;gap:1.1rem;background:var(--card-strong);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transform:translateZ(0);
    border:1px solid rgba(255,255,255,.95);border-radius:var(--radius);padding:1.05rem 1.05rem;box-shadow:var(--shadow);flex-wrap:wrap;margin-bottom:1rem}
  .contact-card img{width:118px;height:118px;border-radius:16px;box-shadow:var(--shadow-sm);flex-shrink:0;background:#fff}
  .cc-main{flex:1;min-width:200px}
  .cc-title{font-weight:800;font-size:.98rem;color:var(--ink);margin-bottom:.35rem}
  .cc-desc{font-size:.8rem;color:var(--text);line-height:1.75}
  .cc-desc b{color:var(--green-deep)}

  /* ===================== 病历打印 ===================== */
  #printArea{display:none}
  .report-print{font-family:inherit;color:#222;padding:1.2rem}
  .report-print h1{font-size:1.3rem;color:var(--ink);text-align:center;margin-bottom:.2rem}
  .report-print .rp-sub{text-align:center;font-size:.78rem;color:#888;margin-bottom:.8rem}
  .report-print h2{font-size:1rem;color:var(--ink);margin:.9rem 0 .4rem;border-left:4px solid var(--green);padding-left:.5rem}
  .report-print table{width:100%;border-collapse:collapse;font-size:.85rem}
  .report-print th,.report-print td{border:1px solid #e3e8ea;padding:.45rem .6rem;text-align:left}
  .report-print th{background:#eef5f1;color:var(--ink)}
  .report-print .rp-grid{display:flex;gap:.4rem 1.4rem;flex-wrap:wrap;margin:.2rem 0}
  .report-print .rp-grid span{font-size:.85rem}
  .report-print .rp-grid b{color:#334155;margin-right:.2rem}

  /* ===================== 动效 ===================== */
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
  .rc-btn.ghost .ripple,.mod-card .ripple,.ig-item .ripple,.dock-item .ripple,.stat .ripple{background:rgba(121,187,150,.25)}
  @keyframes rip{to{transform:scale(2.6);opacity:0}}
  .card,.stat,.mod-card,.ig-item{animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both;will-change:transform,opacity}
  .duo-grid .stat:nth-child(1){animation-delay:.04s}.duo-grid .stat:nth-child(2){animation-delay:.1s}
  .icon-grid .ig-item:nth-child(1){animation-delay:.05s}.icon-grid .ig-item:nth-child(2){animation-delay:.1s}.icon-grid .ig-item:nth-child(3){animation-delay:.15s}.icon-grid .ig-item:nth-child(4){animation-delay:.2s}
  .icon-grid .ig-item:nth-child(5){animation-delay:.25s}.icon-grid .ig-item:nth-child(6){animation-delay:.3s}.icon-grid .ig-item:nth-child(7){animation-delay:.35s}.icon-grid .ig-item:nth-child(8){animation-delay:.4s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.card,.stat,.mod-card,.ig-item,.content.view-in{animation:none}}

  /* ===================== 打印 ===================== */

  /* ===================== 小屏 / 全面屏适配 ===================== */
  @media(max-width:380px){
    .phone{padding-left:1rem;padding-right:1rem}
    .greet{padding:.4rem .1rem .7rem}
    .greet h1{font-size:1.5rem}
    .duo-grid{gap:.6rem}
    .stat{padding:.85rem .8rem}
    .icon-grid{gap:.5rem}
    .ig-item{padding:.7rem .2rem}
    .ig-icon{width:38px;height:38px}
    .card{padding:.9rem 1rem}
    .dock-item{font-size:.6rem}
    .dock-item svg{width:20px;height:20px}
    .mod-card{padding:.8rem .85rem;gap:.7rem}
    .mc-icon{width:40px;height:40px}
  }
  @media(max-width:340px){.ig-t{font-size:.7rem}.duo-grid .stat .s-val{font-size:1.7rem}.greet h1{font-size:1.4rem}}
  /* ===================== 就诊摘要 ===================== */
  .sp-sec{margin:.7rem 0;border-top:1px dashed var(--line);padding-top:.55rem}
  .sp-sec>b{color:var(--ink);font-size:.86rem}
  .sp-grid{display:flex;flex-wrap:wrap;gap:.25rem .9rem;margin-top:.4rem}
  .sp-grid span{font-size:.82rem;color:var(--text)}
  .sp-tb{width:100%;border-collapse:collapse;margin-top:.4rem;font-size:.78rem}
  .sp-tb th,.sp-tb td{border:1px solid var(--line);padding:.3rem .5rem;text-align:left}
  .sp-tb th{background:var(--green-soft)}
  .sp-lab{margin:.5rem 0}
  .sp-lab>b{font-size:.86rem;color:var(--ink)}
  .sp-unit{color:var(--muted);margin-left:.3rem;font-size:.78rem}
  .sp-trend{color:var(--green-deep);font-size:.76rem;margin-left:.4rem}
  .sp-reads{margin-top:.15rem}
  .sp-reads span{display:inline-block;margin-right:.8rem;font-size:.78rem;color:var(--text)}
  .sp-tag{display:inline-block;background:var(--green-soft);color:var(--green-deep);border-radius:8px;padding:.15rem .55rem;margin:.2rem .3rem 0 0;font-size:.76rem}
  .demo-note{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:#9a6a1f;border-radius:12px;padding:.55rem .8rem;font-size:.76rem;line-height:1.55;margin-bottom:.8rem}
  .demo-note b{color:#9a6a1f}
  .sp-demo,.ch-demo{display:inline-block;background:rgba(245,158,11,.15);color:#b07617;border:1px solid rgba(245,158,11,.4);border-radius:6px;font-size:.66rem;padding:.05rem .4rem;margin-left:.35rem;vertical-align:middle;font-weight:700}
  .sp-q{font-size:.82rem;color:var(--text);margin:.18rem 0}
  .sp-mut{color:var(--muted);font-size:.8rem;margin-top:.3rem}
  .sp-foot{margin-top:.7rem;font-size:.7rem;color:var(--muted)}
  /* ===================== 康复时间轴 ===================== */
  .tl{position:relative;padding:.3rem 0 .3rem 1.4rem}
  .tl-line{position:absolute;left:9px;top:0;bottom:0;width:2px;background:linear-gradient(var(--green),var(--blue))}
  .tl-month{font-size:.82rem;font-weight:700;color:var(--ink);margin:.7rem 0 .3rem -1.4rem}
  .tl-item{position:relative;margin-bottom:.7rem}
  .tl-dot{position:absolute;left:-1.4rem;top:.35rem;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
  .tl-card{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:.6rem .8rem;box-shadow:var(--shadow-sm)}
  .tl-top{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;margin-bottom:.15rem}
  .tl-type{font-weight:700}
  .tl-date{color:var(--muted)}
  .tl-title{font-size:.86rem;color:var(--ink);font-weight:600}
  .tl-sub{font-size:.76rem;color:var(--text);margin-top:.1rem}
  /* ===================== 家人只读 ===================== */
  .ro-prev{border:1px dashed var(--line);border-radius:12px}
  @media print{
    body *{visibility:hidden}
    #printArea,#printArea *{visibility:visible}
    #printArea{display:block!important;position:absolute;left:0;top:0;width:100%}
    .dock,.overlay,.toast,.notify-banner{display:none!important}
  }
  /* ===================== 字号 / 分段控件 ===================== */
  .seg{display:inline-flex;background:rgba(255,255,255,.5);border:1.5px solid var(--line);border-radius:14px;padding:.25rem;gap:.25rem}
  .seg-btn{border:none;background:transparent;color:var(--ink-2);font-family:inherit;font-weight:700;font-size:.9rem;padding:.4rem 1rem;border-radius:10px;cursor:pointer;transition:all .18s}
  .seg-btn.on{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(121,187,150,.35)}
  /* ===================== 症状预设标签 ===================== */
  .tag-sel{display:flex;flex-wrap:wrap;gap:.5rem;margin:.35rem 0 .2rem}
  .tag-chip{border:1.5px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink-2);font-family:inherit;font-size:.85rem;font-weight:600;padding:.42rem .85rem;border-radius:99px;cursor:pointer;transition:all .15s;user-select:none}
  .tag-chip.active{background:var(--green-soft);border-color:var(--green);color:var(--green-deep)}
  .tag-sel-hint{font-size:.74rem;color:var(--muted);margin:.1rem 0 .4rem}
  /* ===================== 隐私锁 ===================== */
  .lock-screen{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#eef4f1,#e3ecf3);display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .lock-box{width:100%;max-width:340px;text-align:center;background:var(--card-strong);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:var(--shadow);padding:1.8rem 1.4rem}
  .lock-logo{font-size:2.4rem}
  .lock-title{font-size:1.25rem;font-weight:800;color:var(--ink);margin-top:.3rem}
  .lock-sub{font-size:.82rem;color:var(--muted);margin:.4rem 0 1rem;line-height:1.6}
  .lock-dots{display:flex;gap:.7rem;justify-content:center;margin-bottom:.6rem}
  .lock-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--green);transition:all .15s}
  .lock-dots i.on{background:var(--green)}
  .lock-err{color:#e06b6b;font-size:.76rem;min-height:1rem;margin-bottom:.5rem}
  .lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.8rem}
  .lock-pad .lk{border:none;background:rgba(255,255,255,.85);color:var(--ink);font-family:inherit;font-size:1.35rem;font-weight:700;border-radius:14px;padding:.8rem 0;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .08s}
  .lock-pad .lk:active{transform:scale(.94)}
  .lock-pad span{visibility:hidden}
  .lock-bio{width:100%;margin-top:.2rem}
  .lock-screen.shake{animation:lockshake .4s}
  @keyframes lockshake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  /* ===================== 空状态引导 ===================== */
  .hero-cta{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:.7rem}
  .hero-cta .rc-btn{font-size:.82rem;padding:.45rem 1rem}
  .empty-guide{font-size:.82rem;color:var(--muted);text-align:center;padding:.5rem .2rem;line-height:1.7}
  .empty-guide .rc-btn{margin-top:.5rem}

</style>
</head>

function buildLabLib(){
  let h='';
  LAB_LIBRARY.forEach(c=>{
    h+=`<div style="margin-top:.7rem"><div style="font-size:.82rem;color:var(--color-text-secondary);margin-bottom:.3rem;font-weight:600">${c.cat}</div><div style="display:flex;flex-wrap:wrap;gap:.4rem">`;
    c.items.forEach(it=>{const used=state.labs.some(m=>m.name===it.name);h+=`<button class="rc-btn sm ${used?'ghost':''}" ${used?'disabled style="opacity:.55"':'onclick="addLibLab(\''+it.id+'\')"'}>${used?'✓ '+it.name:it.name}</button>`;});
    h+=`</div></div>`;
  });
  return h;
}
function addLibLab(libId){
  for(const c of LAB_LIBRARY){const it=c.items.find(x=>x.id===libId);if(it){
    if(state.labs.some(m=>m.name===it.name)){toast('「'+it.name+'」已在列表中');return;}
    const color=PALETTE[state.labs.length%PALETTE.length];
    state.labs.push({id:it.id,name:it.name,unit:it.unit,refLow:it.low,refHigh:it.high,color,seeded:false,readings:[]});
    save();toast('已添加：'+it.name);showView('labs');return;
  }}
  toast('未找到该指标');
}
function addAllLibLabs(){
  const total=LAB_LIBRARY.reduce((s,c)=>s+c.items.length,0);
  if(!confirm('将一次性添加指标库中全部 '+total+' 个指标（已存在的会跳过）。确定吗？'))return;
  let n=0;
  LAB_LIBRARY.forEach(c=>c.items.forEach(it=>{if(!state.labs.some(m=>m.name===it.name)){state.labs.push({id:it.id,name:it.name,unit:it.unit,refLow:it.low,refHigh:it.high,color:PALETTE[state.labs.length%PALETTE.length],seeded:false,readings:[]});n++;}}));
  save();toast('已添加 '+n+' 个指标');showView('labs');
}

function renderDock(){
  document.getElementById('dock').innerHTML=TABS.map(t=>`<div class="dock-item" data-tab="${t.k}" onclick="showView('${t.k}')">${icon(t.i,22)}<span>${t.t}</span></div>`).join('');
}
function backTarget(k){
  for(const hk in HUBS){if(HUBS[hk].items.some(i=>i.k===k))return hk;}
  return 'dashboard';
}
function setActive(k){
  const tab=(k==='dashboard'||HUBS[k])?k:backTarget(k);
  document.querySelectorAll('.dock-item').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));
}
function buildHub(hk){
  const hub=HUBS[hk];
  return `<div class="view-head"><h2>${hub.title}</h2><p>${hub.desc}</p></div><div class="hub-grid">`+
    hub.items.map(it=>{const cfg=MODULES[it.k];const desc=cfg?cfg.desc:it.d;
      return `<div class="mod-card" onclick="showView('${it.k}')"><div class="mc-icon">${icon(it.k,22)}</div><div class="mc-body"><div class="mc-title">${it.t}</div><div class="mc-desc">${desc}</div></div><span class="mc-go">›</span></div>`;}).join('')+
    `</div>`;
}

/* ===================== 通用列表模块 ===================== */
function buildListModule(k){
  const cfg=MODULES[k];
  let h=`<div class="view-head"><h2>${cfg.icon} ${cfg.title}</h2><p>${cfg.desc}</p></div>`;
  h+=`<div class="card"><h3>＋ 新增一条</h3><div class="grid-form">`;
  cfg.fields.forEach(f=>{
    h+=`<div class="field"><label>${f.label}</label>`;
    if(f.type==='select'){
      if(k==='symptoms'&&f.k==='type'){
        h+=`<div class="tag-sel-hint">可多选，点选今天出现的不适（也可只勾一个）：</div><div class="tag-sel" id="symTagSel">`+f.opts.map(o=>`<button type="button" class="tag-chip" data-tag="${o}" onclick="toggleTag(this)">${o}</button>`).join('')+`</div>`;
      }else{
        h+=`<select id="f_${k}_${f.k}">${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`;
      }
    }
    else if(f.type==='textarea') h+=`<textarea id="f_${k}_${f.k}" rows="2" placeholder="${f.ph||''}"></textarea>`;
    else if(f.type==='date') h+=`<input type="date" id="f_${k}_${f.k}" value="${f.def?f.def():today()}">`;
    else h+=`<input type="${f.type==='number'?'number':'text'}" id="f_${k}_${f.k}" placeholder="${f.ph||''}" ${f.min!=null?'min="'+f.min+'"':''} ${f.max!=null?'max="'+f.max+'"':''}>`;
    h+=`</div>`;
  });
  h+=`</div><button class="rc-btn" onclick="addEntry('${k}')">保存记录</button></div>`;
  const list=(state[k]||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  h+=`<div class="card"><h3>📋 已记录（${list.length}）</h3><div class="list">`;
  if(!list.length) h+=`<div class="empty-tip">还没有记录，在上面添加第一条吧。</div>`;
  list.forEach(r=>h+=listItem(k,r));
  h+=`</div></div>`;
  if(k==='reminders') h+=buildNotifyPanel();
  return h;
}
function buildNotifyPanel(){
  let html=`<div class="card"><h3>🔔 本机提醒设置</h3><div style="font-size:.88rem;color:var(--color-text-secondary);line-height:1.7;margin-bottom:.8rem">
    开启后，应用会在后台按你设定的时间弹出<b>桌面通知 + 页内提醒</b>（需保持本页面打开，且浏览器允许通知）。也可点击下方每条提醒的“测试”按钮预览效果。</div>`;
  const perm=(typeof Notification!=='undefined')?Notification.permission:'denied';
  if(perm==='granted'){
    html+=`<button class="rc-btn ghost" onclick="checkReminders(true)">立即检查一次</button> <span class="pill green">通知已开启</span>`;
  }else if(perm==='denied'){
    html+=`<span class="pill red">通知被浏览器拦截</span> <span style="font-size:.85rem;color:var(--color-text-muted)">请在浏览器地址栏的权限设置中允许通知后刷新。</span>`;
  }else{
    html+=`<button class="rc-btn" onclick="enableNotify()">开启桌面通知</button>`;
  }
  html+=`</div>`;
  return html;
}
function enableNotify(){
  if(typeof Notification==='undefined'){toast('当前浏览器不支持通知');return;}
  Notification.requestPermission().then(p=>{
    if(p==='granted'){toast('通知已开启');showView('reminders');startReminderTimer();}
    else toast('未授权通知，将仅使用页内提醒');
  });
}
function notify(title,body){
  // 页内 banner（始终可用）
  showBanner(title,body);
  // 桌面通知（需授权）
  try{if(typeof Notification!=='undefined'&&Notification.permission==='granted')new Notification(title,{body});}catch(e){}
}
function showBanner(title,body){
  const b=document.getElementById('notifyBanner');
  b.innerHTML=`<span class="nb-icon">⏰</span><div><b>${title}</b><br><span style="font-size:.82rem;opacity:.85">${body}</span></div><span class="nb-close" onclick="document.getElementById('notifyBanner').classList.remove('show')">×</span>`;
  b.classList.add('show');
  clearTimeout(window._nb);window._nb=setTimeout(()=>{b.classList.remove('show');},12000);
}
function testRemind(id){
  const r=state.reminders.find(x=>x.id==id);if(!r)return;
  notify('⏰ 提醒测试 · '+r.type, (r.time||'')+' '+r.content);
  toast('已触发测试提醒');
}
function checkReminders(force){
  if(!state.reminders||!state.reminders.length)return;
  const now=new Date();const ds=now.toTimeString().slice(0,5);const dayKey=now.toISOString().slice(0,10);
  const fired=[];
  state.reminders.forEach(r=>{
    if(!r.time||r.time>ds)return;
    const key=dayKey+'@'+r.time+'@'+r.id;
    if(!force&&sessionStorage.getItem('rm_'+key))return;
    sessionStorage.setItem('rm_'+key,'1');
    fired.push(r);
  });
  if(!fired.length)return;
  const title='⏰ 事项提醒 · 共 '+fired.length+' 项';
  const body=fired.map(r=>r.time+' '+r.content).join('；');
  notify(title,body);
}
function startReminderTimer(){
  if(window._rmTimer)return;
  window._rmTimer=setInterval(()=>checkReminders(false),20000);
}
function listItem(k,r){
  const cfg=MODULES[k];
  let meta;
  if(k==='symptoms'){
    const parts=[];
    if(r.date)parts.push(`<span class="chip"><b>日期</b>${r.date}</span>`);
    if((r.tags&&r.tags.length)||r.type)parts.push(`<span class="chip"><b>症状</b>${symLabel(r)}</span>`);
    if(r.level)parts.push(`<span class="chip"><b>程度</b>${r.level}/10</span>`);
    if(r.part)parts.push(`<span class="chip"><b>部位</b>${r.part}</span>`);
    if(r.note)parts.push(`<span class="chip"><b>备注</b>${r.note}</span>`);
    meta=parts.join('');
  }else{
    meta=cfg.fields.map(f=>`<span class="chip"><b>${f.label}</b>${r[f.k]!=null&&r[f.k]!==''?r[f.k]:'—'}</span>`).join('');
  }
  let extra='';
  if(cfg.hasDone){const done=!!r.done;extra+=`<button class="rc-btn sm ${done?'ghost':''}" onclick="toggleDone('${k}','${r.id}')">${done?'✓ 已完成':'标记完成'}</button>`;}
  if(k==='reminders'){extra+=`<button class="rc-btn sm ghost" onclick="testRemind('${r.id}')">测试</button>`;}
  return `<div class="list-item" ${cfg.hasDone&&r.done?'style="opacity:.6"':''}><div class="li-main">${meta}</div>${extra}<button class="ri-del" onclick="delEntry('${k}','${r.id}')" title="删除">🗑</button></div>`;
}
function toggleDone(k,id){const r=state[k].find(x=>x.id==id);if(!r)return;r.done=!r.done;save();showView(k);toast(r.done?'已标记为完成':'已恢复未完成');}
function addEntry(k){
  const cfg=MODULES[k];const rec={id:'e'+Date.now()};
  if(k==='symptoms'){
    const tags=[...document.querySelectorAll('#symTagSel .tag-chip.active')].map(b=>b.dataset.tag);
    if(!tags.length){toast('请至少勾选一个症状');return;}
    rec.tags=tags;
  }
  for(const f of cfg.fields){
    if(k==='symptoms'&&f.k==='type')continue; /* 症状标签已在上方处理 */
    const n=document.getElementById('f_'+k+'_'+f.k);if(!n)continue;
    rec[f.k]=f.type==='number'?parseFloat(n.value):n.value;
  }
  if(!state[k])state[k]=[];
  state[k].push(rec);save();toast('已保存');firstEntryNudge();showView(k);
}
function toggleTag(btn){btn.classList.toggle('active');}
function symLabel(s){return (s.tags&&s.tags.length)?s.tags.join('/'):(s.type||'不适');}
function delEntry(k,id){state[k]=state[k].filter(x=>x.id!=id);save();showView(k);toast('已删除');}

function addMed(){

function markMed(id){const d=today();if(state.medLogs.some(l=>l.medId==id&&l.date==d)){toast('今天已打卡');return;}state.medLogs.push({id:'l'+Date.now(),medId:id,date:d});save();toast('打卡成功');showView('meds');}
function delMed(id){state.meds=state.meds.filter(x=>x.id!=id);state.medLogs=state.medLogs.filter(x=>x.medId!=id);save();showView('meds');}

/* ===================== 指标（含趋势图） ===================== */
function scalePoints(vals){const n=vals.length;if(!n)return[];if(n===1)return[{x:100,y:35}];const min=Math.min(...vals),max=Math.max(...vals),range=(max-min)||1,x0=14,yT=12,yB=58,w=172;return vals.map((v,i)=>({x:x0+i*(w/(n-1)),y:yB-((v-min)/range)*(yB-yT)}));}
function drawChart(m){
  const vals=m.readings.map(r=>r.value);const pts=scalePoints(vals);const c=m.color;
  let s=`<svg viewBox="0 0 200 70" width="100%" height="70">`;
  if(pts.length>=2)s+=`<polyline points="${pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1&&pts.length>=2;s+=last?`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2.5"/>`:`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${c}"/>`;});
  s+=`</svg>`;return s;
}
function buildLabs(){
  let h=`<div class="view-head"><h2>🧪 指标跟踪</h2><p>录入肿瘤标志物、血常规、肝肾功能等，自动生成趋势图，超参考范围会有提示。</p></div>`;
  h+=`<div class="card"><div id="labCharts" class="charts-grid">`;
  state.labs.forEach(m=>{
    const vals=m.readings.map(r=>r.value);const last=m.readings[m.readings.length-1];
    let status='';
    if(last){
      status=`本次 ${last.value}${m.unit?' '+m.unit:''}`;
      if(m.refHigh!=null){
        const hi=m.refHigh, lo=m.refLow!=null?m.refLow:0;
        if(last.value>hi)status+=`，高于参考上限 ${hi}`;
        else if(m.refLow!=null&&last.value<lo)status+=`，低于参考下限 ${lo}`;
        else status+=`，在您的参考范围内`;
      }
      if(m.readings.length>=2){
        const prev=m.readings[m.readings.length-2].value;
        const d=+(last.value-prev).toFixed(2);
        status+=`；较上次 ${d>0?'↑':'↓'}${Math.abs(d)}${m.unit?' '+m.unit:''}`;
      }
    }
    const last4=vals.slice(-4);

let _labImgData=null;
function previewLabImage(input){
  const f=input.files&&input.files[0];if(!f){return;}
  document.getElementById('labImgName').textContent=f.name;

async function startRecognize(){
  if(!_labImgData){toast('请先选择图片');return;}
  const status=document.getElementById('labImgStatus');
  if(!ai||!ai.enabled||!ai.apiKey){status.innerHTML='⚠️ 需先在「知识库问答 → ⚙ 在线回答」中配置<b>支持视觉</b>的模型（如 <code>qwen-vl-max</code> / <code>gpt-4o</code>）并填入 API Key，同时建议使用本地代理（ai_proxy.py）避免跨域失败。';return;}
  status.textContent='识别中…（图片与数据仅在本机处理）';
  try{
    const txt=await callVision(_labImgData);
    const items=parseLabJSON(txt);
    if(!items.length){status.innerHTML='未能从图片解析出指标。可对照上方图片，用下方「录入数值」手动添加。';return;}
    let added=0;
    items.forEach((it,idx)=>{
      const key=it.name.replace(/\s|（|\(|）|\)/g,'').toLowerCase();
      let m=state.labs.find(x=>x.name.replace(/\s|（|\(|）|\)/g,'').toLowerCase()===key);
      if(!m){const color=PALETTE[state.labs.length%PALETTE.length];m={id:'l'+(Date.now())+'_'+idx,name:it.name,unit:it.unit||'',refLow:(it.low!=null?it.low:0),refHigh:(it.high!=null?it.high:null),color,seeded:false,readings:[]};state.labs.push(m);}
      m.readings.push({date:today(),value:it.value});m.readings.sort((a,b)=>a.date.localeCompare(b.date));m.seeded=false;added++;
    });
    save();status.innerHTML='✅ 已识别并导入 <b>'+added+'</b> 项指标（默认记录为今天）。请在下方图表核对数值与参考范围，必要时用「新增指标」修正单位/范围。';
    showView('labs');
  }catch(e){status.innerHTML='⚠️ 识别失败：'+((e&&e.message)?e.message:String(e)).slice(0,140)+'。可对照图片手动录入。';}
}
function parseLabJSON(txt){
  function norm(o){return {name:o.name||o.指标||o.项目||'',value:parseFloat(o.value!=null?o.value:o.数值!=null?o.数值:o.结果),unit:o.unit||o.单位||'',low:(o.low!=null?parseFloat(o.low):(o.参考下限!=null?parseFloat(o.参考下限):null)),high:(o.high!=null?parseFloat(o.high):(o.参考上限!=null?parseFloat(o.参考上限):null))};}
  function clean(x){return x&&typeof x.value==='number'&&!isNaN(x.value)?x:null;}
  try{const m=txt.match(/\[[\s\S]*\]/);if(m){const a=JSON.parse(m[0]).map(norm).filter(clean);if(a.length)return a;}}catch(e){}
  try{const m=txt.match(/\{[\s\S]*\}/);if(m){const o=clean(norm(JSON.parse(m[0])));if(o)return [o];}}catch(e){}
  return [];
}
async function callVision(base64){
  const url=(ai.baseUrl.replace(/\/$/,'')+'/chat/completions');
  const prompt='你是医学检验报告识别助手。请识别图片里的检验指标，仅返回一个JSON数组，元素形如 {"name":"指标名","value":数值,"unit":"单位","low":参考下限数值或null,"high":参考上限数值或null}。只输出JSON，不要任何解释或markdown。';
  const body={model:ai.model,messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:base64}}]}],temperature:0};
  const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ai.apiKey},body:JSON.stringify(body)});
  if(!resp.ok)throw new Error('HTTP '+resp.status);
  const d=await resp.json();
  return (d.choices&&d.choices[0]&&d.choices[0].message)?d.choices[0].message.content:'';
}

function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
/* 读取图片并等比缩小到最大边 maxDim，控制体积以便存入本地；不做任何识别/OCR */
function readAndShrink(f,maxDim){
  return fileToDataURL(f).then(d=>new Promise((res)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxDim/Math.max(w,h));
        if(scale<1){w=Math.round(w*scale);h=Math.round(h*scale);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.82));
      }catch(e){res(d);}
    };
    img.onerror=()=>res(d);
    img.src=d;
  }));
}
async function uploadFiles(key,inputId){
  const files=[...document.getElementById(inputId).files];
  if(!files.length)return;
  for(const f of files){
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    const isImg=f.type.startsWith('image/')||['png','jpg','jpeg','gif','webp','bmp'].includes(ext);
    const rec={id:'d'+Date.now()+Math.random().toString(36).slice(2),name:f.name,date:today(),type:ext};
    try{
      if(isImg){
        let data=await readAndShrink(f,2000);
        if(data&&data.length>3600000){rec.note='图片过大，已压缩留档';} /* 极端情况下仍存，但提示 */
        rec.data=data;
      }else if(f.size<=2*1024*1024){
        rec.data=await fileToDataURL(f);
      }else{
        rec.note='文件超过 2MB，仅留档名称（未内嵌内容）';
      }
    }catch(e){rec.note='读取失败，仅留档名称';}
    state[key].unshift(rec);
  }
  save();toast('已留档 '+files.length+' 个文件（原图仅存本机）');
  document.getElementById(inputId).value='';renderUploadList(key);
}

/* 日期组合输入：文本框可直接键入（自动格式化为 YYYY-MM-DD），右侧 📅 打开系统日历 */
function dateFieldHTML(id,label,val,ph){
  return `<div class="date-wrap"><input type="text" id="${id}" inputmode="numeric" placeholder="${ph||'如 1965-08-20'}" value="${val||''}" oninput="fmtDate(this,event)"><button type="button" class="date-btn" title="${label||''}日历选择" onclick="pickDate('${id}_native')">📅</button><input type="date" id="${id}_native" class="date-native" tabindex="-1" aria-hidden="true" onchange="document.getElementById('${id}').value=this.value"></div>`;
}
function fmtDate(el,ev){
  if(ev&&/insertFromPaste|insertFromDrop|history/.test(ev.inputType||''))return; /* 粘贴/拖放不重排，保存时规范化 */
  const d=el.value.replace(/\D/g,'').slice(0,8);
  if(d.length>6)el.value=d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);
  else if(d.length>4)el.value=d.slice(0,4)+'-'+d.slice(4);
  else el.value=d;
}
function normDate(v){
  if(!v)return '';
  v=String(v).trim();
  const ok=(y,mo,d)=>y>=1900&&y<=2100&&mo>=1&&mo<=12&&d>=1&&d<=new Date(y,mo,0).getDate();
  const fmt=(y,mo,d)=>`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const m=v.match(/^(\d{4})[-\/.年]?(\d{1,2})[-\/.月]?(\d{1,2})日?$/);
  if(m&&ok(+m[1],+m[2],+m[3]))return fmt(+m[1],+m[2],+m[3]);
  const dg=v.replace(/\D/g,'');
  if(dg.length===8&&ok(+dg.slice(0,4),+dg.slice(4,6),+dg.slice(6)))return fmt(+dg.slice(0,4),+dg.slice(4,6),+dg.slice(6));
  if(dg.length===7&&ok(+dg.slice(0,4),+dg[4],+dg.slice(5)))return fmt(+dg.slice(0,4),+dg[4],+dg.slice(5));
  const dt=new Date(v);
  return isNaN(dt)?v:dt.toISOString().slice(0,10);
}
function pickDate(nativeId){
  const n=document.getElementById(nativeId);
  const t=document.getElementById(nativeId.replace('_native',''));
  if(t&&t.value){const nd=normDate(t.value);if(/^\d{4}-\d{2}-\d{2}$/.test(nd))n.value=nd;}
  try{if(n.showPicker)n.showPicker();else n.click();}
  catch(e){try{n.click();}catch(_){}}
}

function ringProgress(){
  /* 真实统计：只按当天实际完成计算，无任何兜底值，未建档/未记录 = 0%
     权重：用药打卡 40（未添加药物则不计入）、身体记录 35（症状/疼痛/饮食/运动任一）、心情打卡 25 */
  const t=today();
  const mt=state.meds.length;
  const tk=state.meds.filter(m=>state.medLogs.some(l=>l.medId==m.id&&l.date==t)).length;
  const recDone=state.symptoms.some(s=>s.date===t)||state.diet.some(d=>d.date===t)||state.pain.some(p=>p.date===t)||state.exercise.some(e=>e.date===t);
  const moodDone=state.mood.some(m=>m.date===t);
  let total=0,earned=0;
  if(mt>0){total+=40;earned+=40*tk/mt;}
  total+=35;if(recDone)earned+=35;
  total+=25;if(moodDone)earned+=25;
  return total?Math.round(earned/total*100):0;
}
function smoothPath(pts){
  if(!pts.length)return '';
  if(pts.length===1)return `M${pts[0].x},${pts[0].y}`;
  let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const p0=pts[i-1],p1=pts[i],mx=(p0.x+p1.x)/2;
    d+=` C${mx},${p0.y} ${mx},${p1.y} ${p1.x},${p1.y}`;
  }
  return d;
}
function trendInfo(vals){
  if(!vals||vals.length<2)return null;
  const a=vals[vals.length-2],b=vals[vals.length-1];
  if(Math.abs(b-a)<=Math.max(0.3,Math.abs(a)*0.08))return {text:'趋势平稳',cls:'flat'};
  return b>a?{text:'趋势上升',cls:'up'}:{text:'趋势下降',cls:'down'};
}

function lastN(arr,n){return arr.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,n);}
function trendDelta(m){
  if(m.readings.length<2)return null;
  const a=m.readings[m.readings.length-2].value,b=m.readings[m.readings.length-1].value;
  const d=+(b-a).toFixed(2);return (d>0?'↑':'↓')+Math.abs(d)+(m.unit?' '+m.unit:'');
}

function buildTimeline(){
  let h=`<div class="view-head"><h2>🕰 康复时间轴</h2><p>把治疗、复查、指标、用药按时间串起来，看清自己的病程。</p></div>`;
  const ev=[];
  (state.treatments||[]).forEach(t=>{if(t.date)ev.push({date:t.date,type:'治疗',color:'#ef9f5b',title:(t.type||'治疗')+' · '+(t.name||''),sub:(t.cycle||'')+(t.side?'｜副作用：'+t.side:'')});});
  (state.followups||[]).forEach(f=>{if(f.date)ev.push({date:f.date,type:'复查',color:'#5f92c9',title:'复查 · '+(f.item||''),sub:(f.hospital||'')+(f.done?'｜已完成':'｜待复查')});});
  const hasRealLabs=(state.labs||[]).some(l=>!l.seeded&&l.readings&&l.readings.length);
  (state.labs||[]).forEach(m=>{
    if(m.seeded&&hasRealLabs)return; /* 用户已录入真实指标，示例退出 */
    (m.readings||[]).forEach(r=>ev.push({date:r.date,type:'指标',color:m.color||'#10b981',title:(m.name||'')+'：'+(r.value)+(m.unit?' '+m.unit:'')+(m.seeded?'（示例）':''),sub:''}));
  });
  (state.meds||[]).forEach(m=>{if(m.start)ev.push({date:m.start,type:'用药',color:'#79bb96',title:'开始用药 · '+(m.name||''),sub:(m.dose||'')+' '+(m.freq||'')+(m.end?'（至 '+m.end+'）':''),end:m.end});});
  (state.symptoms||[]).forEach(s=>{if(s.date)ev.push({date:s.date,type:'症状',color:'#e06b9b',title:'不适 · '+symLabel(s),sub:(s.level?('程度 '+s.level+'/10'):'')+(s.part?('｜'+s.part):'')});});
  if(!ev.length)h+=`<div class="card"><div class="empty-tip">还没有可串成时间轴的数据。先在「用药 / 指标 / 治疗 / 复查 / 症状」里记录，这里会自动按时间排好。</div></div>`;
  else{
    if(!hasRealLabs&&(state.labs||[]).some(l=>l.seeded&&l.readings&&l.readings.length))h+=`<div class="demo-note">⚠️ 时间轴中的「指标」为内置<b>示例数据</b>；录入自己的指标后，示例会自动退出时间轴。</div>`;
    ev.sort((a,b)=>a.date.localeCompare(b.date));
    let lastM='';
    h+=`<div class="tl"><div class="tl-line"></div>`;
    ev.forEach(e=>{
      const m=e.date.slice(0,7);
      const head=m!==lastM?`<div class="tl-month">${e.date.slice(0,4)} 年 ${parseInt(e.date.slice(5,7))} 月</div>`:'';
      lastM=m;
      h+=head+`<div class="tl-item"><span class="tl-dot" style="background:${e.color}"></span>
        <div class="tl-card"><div class="tl-top"><span class="tl-type" style="color:${e.color}">${e.type}</span><span class="tl-date">${e.date}</span></div>
        <div class="tl-title">${esc(e.title)}</div>${e.sub?`<div class="tl-sub">${esc(e.sub)}</div>`:''}</div></div>`;
    });
    h+=`</div>`;
  }
  return h;
}

  EXPORT_ITEMS.forEach(it=>{
    const on=sel.includes(it.k);
    if(it.k==='meds'){out.meds=on?(state.meds||[]):[];out.medLogs=on?(state.medLogs||[]):[];}
    else out[it.k]=on?(state[it.k]||(it.k==='profile'?{}:[])):(it.k==='profile'?{}:[]);
  });
  out._exportedAt=new Date().toISOString();out._selective=true;
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='肿瘤康复助手_导出_'+today()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);markBackupDone();closeModal();toast('已导出选中数据');
}
function daysBetween(a,b){const d=(new Date(b)-new Date(a))/86400000;return Math.round(d);}
